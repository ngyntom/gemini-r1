  // Huy hiệu chất lượng: Loa Pi -> trạng thái Pi có sẵn "chat_luong"; Máy này
  // -> hỏi /api/music/stream_info (lấy từ đệm link stream, 1 lần/bài).
  const chatLuongMay = {};
  function capNhatChatLuong(data) {
    const el = document.getElementById('music-chat-luong');
    if (!el) return;
    const ve = (cl) => {
      const chu = cl ? [cl.codec, cl.kbps ? cl.kbps + ' kbps' : '', cl.khz ? cl.khz + ' kHz' : ''].filter(Boolean).join(' · ') : '';
      el.textContent = chu;
      el.title = chu ? 'Chất lượng luồng nhạc: ' + chu : '';
      el.style.display = chu && data.state !== 'stopped' ? '' : 'none';
      // Trình phát mở rộng (điện thoại) hiện chữ in hoa giữa 2 mốc thời gian.
      window.dispatchEvent(new CustomEvent('nhac-chat-luong', { detail: data.state !== 'stopped' ? chu.toUpperCase() : '' }));
    };
    if (!data || data.state === 'stopped' || !data.id) { ve(null); return; }
    if (!data.trenMay) { ve(data.chat_luong); return; }
    if (data.id in chatLuongMay) { ve(chatLuongMay[data.id]); return; }
    chatLuongMay[data.id] = null;
    ve(null);
    api('/api/music/stream_info/' + encodeURIComponent(data.id)).then((r) => {
      chatLuongMay[data.id] = r.chat_luong || null;
      if (baiKhungPhat && baiKhungPhat.id === data.id) ve(chatLuongMay[data.id]);
    }).catch(() => { delete chatLuongMay[data.id]; });
  }

  // ---------- Tab "Khám phá" (mặc định) - các hàng thẻ cuộn ngang kiểu Tidal:
  // Nghe gần đây (lịch sử chung trên Pi) | Dành cho bạn (bài liên quan bài vừa
  // nghe) | Yêu thích | các chủ đề (Thịnh hành, Hot TikTok, Bolero...). Hàng
  // nào cần gọi YouTube thì tải RIÊNG (/api/music/kham_pha/<id>, server lưu
  // đệm vài giờ) - hàng nào xong vẽ hàng đó, không chờ nhau. Chạm thẻ = phát
  // cả hàng từ thẻ đó; chạm tên hàng = mở cả hàng thành danh sách đầy đủ;
  // giữ lâu / chuột phải thẻ = menu bài (moMenuBai).
  let khamPhaHang = [];          // [{id, ten, phu}]
  const khamPhaBai = {};         // id hàng -> [bài] | null (đang tải)
  let khamPhaTaiLuc = 0;

  // epMoi: nút ⟳ - Pi bỏ qua đệm, tìm lại ngay (thẻ cũ vẫn hiện tới khi có mới).
  // Không ép: chỉ tải lại khi đã quá 10 phút (mở tab Khám phá, quay lại app).
  let khamPhaDangTai = false;
  let choBanLuc = 0;
  async function taiKhamPha(epMoi) {
    if (khamPhaDangTai) return;
    if (!epMoi && Date.now() - khamPhaTaiLuc < 10 * 60 * 1000 && khamPhaHang.length) return;
    khamPhaDangTai = true;
    khamPhaTaiLuc = Date.now();
    document.getElementById('music-kp-lam-moi')?.classList.add('dang-xoay');
    let d;
    // Nghe gần đây / Dành cho bạn RIÊNG từng máy (mã máy) - hàng chủ đề dùng chung.
    try { d = await api('/api/music/kham_pha?may=' + encodeURIComponent(MAY_ID)); } catch (e) { ketThucTaiKhamPha(); return; }
    khamPhaBai.gan_day = d.gan_day || [];
    khamPhaHang = d.hang || [];
    khamPhaHang.forEach((h) => { if (!khamPhaBai[h.id]) khamPhaBai[h.id] = null; });
    if (tabDangXem === 'kham_pha') veKetQua();
    kpCho = new Set(khamPhaHang.map((h) => h.id));
    kpEpMoi = !!epMoi;
    kpChay();
  }

  // Tải các hàng theo ƯU TIÊN NHÌN THẤY: 2 hàng cùng lúc, mỗi lần chọn hàng kế
  // thì hàng đang trong màn hình (hoặc sắp cuộn tới) lên trước, xếp trên ->
  // dưới; hàng nằm xa bên dưới tải sau cùng. Trước đây tải lần lượt theo thứ
  // tự cố định - 1 hàng phía trên chậm (Pi gọi YouTube) chặn cả các hàng dưới.
  let kpCho = new Set();        // id hàng còn phải tải
  let kpDangChay = 0;
  let kpEpMoi = false;
  const KP_SONG_SONG = 2;
  function kpThuTu() {
    const v = document.getElementById('music-results');
    const vr = v.getBoundingClientRect();
    return [...kpCho].map((id) => {
      const li = v.querySelector('.mkp-hang[data-muc="' + id + '"]');
      const r = li && li.offsetParent ? li.getBoundingClientRect() : null;
      const thay = !!r && r.bottom > vr.top && r.top < vr.bottom + 300;
      return { id, diem: (thay ? 0 : 1e6) + (r ? r.top : 2e6) };
    }).sort((a, b) => a.diem - b.diem).map((x) => x.id);
  }
  function kpChay() {
    while (kpDangChay < KP_SONG_SONG && kpCho.size) {
      const id = kpThuTu()[0];
      kpCho.delete(id);
      kpDangChay++;
      api('/api/music/kham_pha/' + encodeURIComponent(id) + '?may=' + encodeURIComponent(MAY_ID) + (kpEpMoi ? '&moi=1' : ''))
        .then((r) => { khamPhaBai[id] = r.bai || []; if (id === 'cho_ban') choBanLuc = Date.now(); })
        .catch(() => { khamPhaBai[id] = khamPhaBai[id] || []; })
        .finally(() => {
          kpDangChay--;
          veLaiHangKhamPha(id);
          if (!kpCho.size && !kpDangChay) ketThucTaiKhamPha();
          else kpChay();
        });
    }
  }
  function ketThucTaiKhamPha() {
    khamPhaDangTai = false;
    document.getElementById('music-kp-lam-moi')?.classList.remove('dang-xoay');
  }

  // Bài mới bắt đầu phát (Máy này hoặc Loa Pi) -> "Nghe gần đây" cập nhật NGAY;
  // "Dành cho bạn" tính lại theo bài vừa nghe (tối đa 10 phút/lần - mỗi lần
  // Pi gọi YouTube ~10s), hẹn 20s sau để không tính khi bấm Tiếp liên tục.
  let henChoBan = null;
  function capNhatGanDay(bai) {
    if (!bai || !bai.id) return;
    khamPhaBai.gan_day = [bai].concat((khamPhaBai.gan_day || []).filter((b) => b.id !== bai.id)).slice(0, 20);
    veLaiHangKhamPha('gan_day');
    clearTimeout(henChoBan);
    henChoBan = setTimeout(async () => {
      if (Date.now() - choBanLuc < 10 * 60 * 1000 || khamPhaDangTai) return;
      choBanLuc = Date.now();
      try {
        const ds = (await api('/api/music/kham_pha/cho_ban?may=' + encodeURIComponent(MAY_ID))).bai || [];
        if (ds.length) { khamPhaBai.cho_ban = ds; veLaiHangKhamPha('cho_ban'); }
      } catch (e) { /* để lần sau */ }
    }, 20000);
  }

  function ghiLichSuMay(bai) {
    if (!bai || !bai.id) return;
    capNhatGanDay(bai);
    fetch('/api/music/history', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bai, may_id: MAY_ID }) }).catch(() => {});
  }

  function cacHangKhamPha() {
    const out = [{ id: 'gan_day', ten: 'Nghe gần đây', phu: 'Những bài bạn vừa nghe' }];
    const hang = khamPhaHang.length ? khamPhaHang : [{ id: 'cho_ban', ten: 'Dành cho bạn', phu: '' }];
    out.push(hang[0]);
    out.push({ id: 'yeu_thich', ten: 'Yêu thích của bạn', phu: dsYeuThich.length + ' bài' });
    return out.concat(hang.slice(1));
  }

  function baiCuaHang(id) {
    return id === 'yeu_thich' ? dsYeuThich : khamPhaBai[id];
  }

  function veKhamPha(ul) {
    cacHangKhamPha().forEach((h) => {
      const li = document.createElement('li');
      li.className = 'mkp-hang';
      li.dataset.muc = h.id;
      li.innerHTML = '<div class="mkp-dau"><a href="#" class="mkp-ten"><span></span><i class="icon f7-icons">chevron_right</i></a>' +
        '<span class="mkp-phu"></span><span class="mkp-mui">' +
        '<a href="#" class="link icon-only mkp-lui" title="Trước"><i class="icon f7-icons">chevron_left</i></a>' +
        '<a href="#" class="link icon-only mkp-toi" title="Tiếp"><i class="icon f7-icons">chevron_right</i></a></span></div>' +
        '<div class="mkp-cuon"></div>';
      // ‹ › kiểu Tidal (máy có chuột): cuộn hàng gần 1 khung; mờ khi tới đầu/cuối.
      const cuon = li.querySelector('.mkp-cuon');
      const truot = (huong) => cuon.scrollBy({ left: huong * Math.max(200, cuon.clientWidth * 0.85), behavior: 'smooth' });
      li.querySelector('.mkp-lui').addEventListener('click', (e) => { e.preventDefault(); truot(-1); });
      li.querySelector('.mkp-toi').addEventListener('click', (e) => { e.preventDefault(); truot(1); });
      cuon.addEventListener('scroll', () => capNhatMuiTen(li), { passive: true });
      li.querySelector('.mkp-ten span').textContent = h.ten;
      li.querySelector('.mkp-phu').textContent = h.phu || '';
      li.querySelector('.mkp-ten').addEventListener('click', (e) => {
        e.preventDefault();
        const ds = baiCuaHang(h.id) || [];
        if (!ds.length) return;
        rungNhe();
        if (h.id === 'yeu_thich') { chonTab('yeu_thich'); return; }
        // Mở cả hàng thành danh sách đầy đủ (dùng chỗ "Kết quả tìm").
        ketQuaTim = ds.slice();
        tuKhoaTim = h.ten;
        ketQuaLaTim = false;
        locTim = 'tat_ca';
        hienChipTim(true);
        luuKetQuaMay();
        chonTab('tim');
        document.getElementById('music-results').scrollTop = 0;
      });
      ul.appendChild(li);
      veTheHang(li, h);
    });
  }

  function veLaiHangKhamPha(id) {
    if (tabDangXem !== 'kham_pha') return;
    const li = document.querySelector('#music-results .mkp-hang[data-muc="' + id + '"]');
    const h = cacHangKhamPha().find((x) => x.id === id);
    if (li && h) { veTheHang(li, h); danhDauBaiDangPhat(); }
  }

  // Thẻ RỘNG GẤP ĐÔI (ảnh ngang 16:9) - 1 thẻ/hàng chọn THEO TIÊU CHÍ, kèm
  // nhãn nói lý do: hàng chủ đề = bài NHIỀU LƯỢT XEM nhất; Dành cho bạn = gợi
  // ý hàng đầu; Yêu thích = bài mới thích. Nghe gần đây: KHÔNG có thẻ rộng -
  // mọi thẻ cùng khung.
  // -> { i: vị trí, nhan: chữ trên ảnh } hoặc null.
  function theRongCuaHang(idHang, ds) {
    if (!ds || ds.length < 3) return null;
    if (idHang === 'gan_day') return null;
    if (idHang === 'cho_ban') return { i: 0, nhan: 'Gợi ý hàng đầu' };
    if (idHang === 'yeu_thich') return { i: 0, nhan: 'Mới thích' };
    let i = -1, nhieu = 0;
    ds.forEach((b, k) => { if ((b.view_count || 0) > nhieu) { nhieu = b.view_count; i = k; } });
    return i >= 0 ? { i, nhan: '🔥 ' + fmtLuotXem(nhieu) } : null;
  }

  function veTheHang(li, h) {
    const cuon = li.querySelector('.mkp-cuon');
    const ds = baiCuaHang(h.id);
    cuon.innerHTML = '';
    if (ds === null || ds === undefined) {          // đang tải -> thẻ xương
      for (let k = 0; k < 6; k++) cuon.insertAdjacentHTML('beforeend', '<span class="mkp-the mkp-xuong"><span class="mkp-anh"></span><span class="mkp-ten-bai">&nbsp;</span><span class="mkp-kenh">&nbsp;</span></span>');
      li.style.display = '';
      return;
    }
    li.style.display = ds.length ? '' : 'none';      // hàng trống (chưa nghe gì...) thì ẩn
    const rong = theRongCuaHang(h.id, ds);
    // Thẻ rộng luôn ĐỨNG ĐẦU hàng (bài nhiều lượt xem nhất hay nằm tít cuối,
    // phải vuốt mới thấy) - thứ tự phát khi chạm thẻ đi theo đúng thứ tự hiện.
    const dsHien = rong && rong.i > 0 ? [ds[rong.i]].concat(ds.filter((_, k) => k !== rong.i)) : ds;
    if (rong) rong.i = 0;
    dsHien.forEach((bai, i) => {
      const the = document.createElement('a');
      the.href = '#';
      const laRong = !!rong && i === rong.i;
      the.className = 'mkp-the' + (laRong ? ' mkp-the-rong' : '');
      the.dataset.id = bai.id || '';
      the.dataset.title = bai.title || '';
      the.innerHTML = '<span class="mkp-anh"><span class="mkp-nut">' +
          '<span class="mkp-choi" title="Phát"><i class="icon f7-icons icon-play-bu">play_fill</i></span>' +
          '<span class="mkp-nut-phu mkp-menu" title="Tuỳ chọn"><i class="icon f7-icons">ellipsis</i></span>' +
          '<span class="mkp-nut-phu mkp-tim" title="Yêu thích"><i class="icon f7-icons">' + (laYeuThich(bai.id) ? 'heart_fill' : 'heart') + '</i></span>' +
        '</span>' +
        '<span class="music-tai"><span class="preloader">' + htmlPreloader() + '</span></span></span>' +
        '<span class="mkp-ten-bai"></span><span class="mkp-kenh"></span>';
      the.querySelector('.mkp-tim').classList.toggle('da-thich', laYeuThich(bai.id));
      if (laRong) {
        const nhan = document.createElement('span');
        nhan.className = 'mkp-nhan';
        nhan.textContent = rong.nhan;
        the.querySelector('.mkp-anh').appendChild(nhan);
      }
      the.querySelector('.mkp-anh').style.backgroundImage = "url('https://i.ytimg.com/vi/" + encodeURIComponent(bai.id) + "/hqdefault.jpg')";
      the.querySelector('.mkp-ten-bai').textContent = bai.title || '';
      the.querySelector('.mkp-kenh').textContent = bai.channel || '';
      let giu = null, daGiu = false;
      const huyGiu = () => { clearTimeout(giu); giu = null; };
      the.addEventListener('touchstart', () => { daGiu = false; giu = setTimeout(() => { daGiu = true; rungNhe(); moMenuBai(bai, the); }, 550); }, { passive: true });
      the.addEventListener('touchmove', huyGiu, { passive: true });
      the.addEventListener('touchend', huyGiu);
      the.addEventListener('contextmenu', (e) => { e.preventDefault(); moMenuBai(bai, the); });
      the.addEventListener('pointerdown', () => taiTruoc([bai]), { passive: true });
      ganTaiTruocKhiRe(the, bai);
      the.addEventListener('click', (e) => {
        e.preventDefault();
        if (daGiu) { daGiu = false; return; }
        if (e.target.closest('.mkp-menu')) { moMenuBai(bai, e.target.closest('.mkp-menu')); return; }
        if (e.target.closest('.mkp-tim')) { doiYeuThich(bai); return; }
        phatDanhSach(dsHien.slice(), i, h.ten);
        moTrangDangPhat();         // như lúc phát từ kết quả tìm
      });
      cuon.appendChild(the);
    });
    requestAnimationFrame(() => capNhatMuiTen(li));
  }

  function capNhatMuiTen(li) {
    const c = li.querySelector('.mkp-cuon');
    li.querySelector('.mkp-lui').classList.toggle('mkp-het', c.scrollLeft <= 2);
    li.querySelector('.mkp-toi').classList.toggle('mkp-het', c.scrollLeft + c.clientWidth >= c.scrollWidth - 2);
  }

  // ---------- Thông tin thêm cho kết quả tìm (kiểu YouTube Music) ----------
  // Nhãn đóng khung theo tên bài: KARAOKE / HÁT LẠI / REMIX / LIVE; bản gốc thì
  // ghi loại "Bài hát" (kênh đã xác minh / Official / MV) hoặc "Video".
  function boDauJs(t) {
    return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[đĐ]/g, 'd').toLowerCase();
  }
  function nhanBai(b) {
    const t = boDauJs(b.title);
    if (/karaoke|\bbeat\b|tone (nam|nu)/.test(t)) return 'KARAOKE';
    if (/cover|hat lai/.test(t)) return 'HÁT LẠI';
    if (/remix|cha ?cha|\bedm\b|vinahouse|nonstop|lofi/.test(t)) return 'REMIX';
    if (/\blive\b|concert|liveshow|music box|truc tiep/.test(t)) return 'LIVE';
    return '';
  }
  function loaiBai(b) {
    if (nhanBai(b)) return '';
    return b.verified || /official|topic/i.test(b.channel || '') || /official|\bmv\b/i.test(b.title || '') ? 'Bài hát' : 'Video';
  }
  // 1234567 -> "1,2 Tr lượt xem" (N = nghìn, Tr = triệu, T = tỷ - như YouTube tiếng Việt).
  function fmtLuotXem(n) {
    if (typeof n !== 'number' || n < 0) return '';
    const gon = (v) => (v < 10 ? v.toFixed(1) : String(Math.round(v))).replace('.', ',').replace(/,0$/, '');
    if (n < 1000) return n + ' lượt xem';
    if (n < 1e6) return gon(n / 1e3) + ' N lượt xem';
    if (n < 1e9) return gon(n / 1e6) + ' Tr lượt xem';
    return gon(n / 1e9) + ' T lượt xem';
  }
  // Dòng phụ: [nhãn | loại] · kênh (chạm được) · thời lượng · lượt xem.
  function veDongPhuBai(phu, bai, coLoai) {
    const nhan = nhanBai(bai);
    if (nhan) {
      const n = document.createElement('span');
      n.className = 'music-nhan';
      n.textContent = nhan;
      phu.appendChild(n);
    }
    const phan = [];
    if (!nhan && coLoai) phan.push(loaiBai(bai));
    phan.forEach((p) => phu.appendChild(document.createTextNode(p + ' · ')));
    if (bai.channel && bai.channel_id) {
      const kenh = document.createElement('span');
      kenh.className = 'music-kenh';
      kenh.textContent = bai.channel;
      phu.appendChild(kenh);
    } else if (bai.channel) {
      phu.appendChild(document.createTextNode(bai.channel));
    }
    const sau = [bai.duration ? fmtTime(bai.duration) : '', fmtLuotXem(bai.view_count)].filter(Boolean);
    if (sau.length) phu.appendChild(document.createTextNode((bai.channel ? ' · ' : '') + sau.join(' · ')));
  }

  // Danh sách "Kết quả tìm" là kết quả TÌM thật (không phải trang kênh / hàng
  // Khám phá mở ra) -> có ô "Kết quả hàng đầu" + chip lọc.
  let ketQuaLaTim = true;
  // Chip "Kết quả tìm" chỉ hiện khi vừa tìm/mở danh sách ở chỗ đó (không nhớ
  // qua lần mở app) - chạm bài để nghe thì ẩn đi, về Khám phá.
  let coTabTim = false;
  function hienChipTim(co) {
    coTabTim = co;
    const c = document.querySelector('#music-tab .music-chip-tim');
    if (c) c.style.display = co ? '' : 'none';
  }
  let locTim = 'tat_ca';
  function laKetQuaTimThat() { return tabDangXem === 'tim' && ketQuaLaTim && !dangTim; }
  function nhomBai(b) { return nhanBai(b) || loaiBai(b); }

  // Kết quả hàng đầu: ưu tiên BẢN GỐC (không karaoke/hát lại/remix) của kênh đã
  // xác minh, tên gần với từ khoá; xếp hạng YouTube làm phụ.
  function chonHangDau(ds) {
    const q = boDauJs(tuKhoaTim);
    let tot = 0, diemTot = -1e9;
    ds.slice(0, 10).forEach((b, i) => {
      let d = -i * 2;
      if (nhanBai(b)) d -= 100;
      if (b.verified) d += 30;
      if (loaiBai(b) === 'Bài hát') d += 10;
      const t = boDauJs(b.title);
      if (q && t.includes(q)) d += 15;
      if (q && (t === q || t.startsWith(q + ' -') || t.startsWith(q + ' |'))) d += 15;
      if (d > diemTot) { diemTot = d; tot = i; }
    });
    return tot;
  }

  function veHangDau(ul, ds) {
    const i = chonHangDau(ds);
    const bai = ds[i];
    const li = document.createElement('li');
    li.className = 'mkq-hang-dau';
    li.innerHTML = '<div class="mkq-nhan-muc">Kết quả hàng đầu</div>' +
      '<div class="mkq-tren"><span class="mkq-anh"></span><div class="mkq-chu"><div class="mkq-ten"></div><div class="mkq-phu music-bai-phu"></div></div>' +
      '<a href="#" class="link icon-only mkq-them" title="Tuỳ chọn"><i class="icon f7-icons">ellipsis</i></a></div>' +
      '<div class="mkq-nut"><a href="#" class="button button-round mkq-phat"><i class="icon f7-icons">play_fill</i><span>Phát</span></a>' +
      '<a href="#" class="button button-round mkq-luu"><i class="icon f7-icons"></i><span></span></a></div>';
    li.querySelector('.mkq-anh').style.backgroundImage = "url('https://i.ytimg.com/vi/" + encodeURIComponent(bai.id) + "/hqdefault.jpg')";
    li.querySelector('.mkq-ten').textContent = bai.title;
    veDongPhuBai(li.querySelector('.mkq-phu'), bai, true);
    const co = laYeuThich(bai.id);
    li.querySelector('.mkq-luu i').textContent = co ? 'heart_fill' : 'heart';
    li.querySelector('.mkq-luu span').textContent = co ? 'Đã lưu' : 'Lưu';
    li.querySelector('.mkq-luu').classList.toggle('da-luu', co);
    li.querySelector('.mkq-phat').addEventListener('click', (e) => { e.preventDefault(); rungNhe(); phatKetQua(i); });
    li.querySelector('.mkq-luu').addEventListener('click', (e) => { e.preventDefault(); doiYeuThich(bai); });
    li.querySelector('.mkq-them').addEventListener('click', (e) => { e.preventDefault(); moMenuBai(bai, e.currentTarget); });
    li.querySelector('.mkq-phu').addEventListener('click', (e) => { if (e.target.closest('.music-kenh')) { e.preventDefault(); moKenh(bai); } });
    ganTaiTruocKhiRe(li, bai);
    ul.appendChild(li);
  }

  // Chip lọc theo loại - chỉ loại có trong kết quả, ít nhất 2 loại mới hiện.
  function veChipLoc(ul, dsGoc) {
    const thuTu = ['Bài hát', 'Video', 'HÁT LẠI', 'KARAOKE', 'REMIX', 'LIVE'];
    const co = new Set(dsGoc.map(nhomBai));
    const loai = thuTu.filter((x) => co.has(x));
    if (loai.length < 2) return;
    const li = document.createElement('li');
    li.className = 'mkq-loc';
    [['tat_ca', 'Tất cả']].concat(loai.map((x) => [x, x === x.toUpperCase() ? x.charAt(0) + x.slice(1).toLowerCase() : x])).forEach(([gt, chu]) => {
      const b = document.createElement('button');
      b.className = 'music-chip' + (locTim === gt ? ' active' : '');
      b.textContent = chu;
      b.addEventListener('click', () => { rungNhe(); locTim = gt; veKetQua(); });
      li.appendChild(b);
    });
    ul.appendChild(li);
  }

  // ---------- Tab "Đang phát" (kiểu trang phát YouTube Music) ----------
  // Trái: ảnh bài lớn + tên/kênh. Phải: thẻ TIẾP THEO (Đang phát từ ... + Lưu,
  // công tắc Tự phát, danh sách đang phát) | LIÊN QUAN (bài liên quan bài
  // đang nghe, chạm = phát ngay). Điện thoại: xếp dọc.
  let dpThe = 'tiep';
  // Hiệu ứng vào trang kiểu YouTube Music (trượt lên + ảnh phóng nhẹ) - CHỈ khi
  // vừa chuyển sang từ trang khác, không chạy lại mỗi lần đổi bài/đổi thẻ.
  let dpHieuUng = false;
  function moTrangDangPhat() {
    hienChipDangPhat(true);
    if (tabDangXem !== 'dang_phat') dpHieuUng = true;
    dpThe = 'tiep';
    chonTab('dang_phat');
    document.getElementById('music-results').scrollTop = 0;
  }
  const lienQuanCache = {};
  function hienChipDangPhat(co) {
    const c = document.querySelector('#music-tab .music-chip-dp');
    if (c) c.style.display = co ? '' : 'none';
    if (!co && tabDangXem === 'dang_phat') chonTab('kham_pha');
  }

  let dpLuot = 0;
  let dpDs = [];         // hàng chờ đang hiện ở tab Đang phát
  let dpBai = {};        // bài đang hiện ở ảnh lớn (chạm tên kênh -> trang kênh)

  // Đổi bài (Tiếp/Trước, hết bài): KHÔNG vẽ lại cả trang - chỉ đổi ảnh (mờ dần
  // sang ảnh mới), tên/kênh, dời vạch sáng trong danh sách. Bài mới không có
  // trong danh sách đang hiện (vd vừa nối bài gợi ý) thì mới vẽ lại.
  function capNhatDangPhatTaiCho(data) {
    const khung = document.querySelector('#music-results .mdp-khung');
    const k = dpDs.findIndex((b) => b.id === data.id);
    if (!khung || k < 0) { veKetQua(); return; }
    const bai = dpDs[k];
    dpBai = bai;
    const img = khung.querySelector('.mdp-anh img');
    img.classList.add('mdp-doi-anh');
    const moi = new Image();
    const dat = (src) => { img.src = src; img.classList.remove('mdp-doi-anh'); };
    // Video không có maxres: YouTube trả 404 KÈM ảnh xám 120x90 -> onload vẫn chạy,
    // onerror không. Nhận ra placeholder theo kích thước rồi lùi về hqdefault.
    const hq = 'https://i.ytimg.com/vi/' + encodeURIComponent(bai.id) + '/hqdefault.jpg';
    moi.onload = () => { if (moi.naturalWidth <= 120 && moi.src !== hq) moi.src = hq; else dat(moi.src); };
    moi.onerror = () => { moi.onerror = null; if (moi.src !== hq) moi.src = hq; else dat(hq); };
    moi.src = 'https://i.ytimg.com/vi/' + encodeURIComponent(bai.id) + '/maxresdefault.jpg';
    khung.querySelector('.mdp-ten').textContent = bai.title || '';
    const phu = khung.querySelector('.mdp-kenh');
    phu.innerHTML = '';
    veDongPhuBai(phu, bai, true);
    document.querySelectorAll('#music-dp-ds li.music-bai-dong').forEach((li, j) => {
      li.classList.toggle('dang-phat', j === k);
      li.classList.toggle('tam-dung', j === k && data.state !== 'playing');
      li.classList.toggle('da-qua', j < k);
    });
    // Liên quan theo bài mới: đang xem thì tìm lại ngay, không thì để lúc mở thẻ.
    const ulLq = document.getElementById('music-dp-lq');
    if (ulLq && ulLq.dataset.bai !== bai.id) {
      if (dpThe === 'lien_quan') veLienQuan(ulLq, bai, dpDs); else ulLq.dataset.bai = '';
    }
    if (dpThe === 'tiep' && document.documentElement.classList.contains('device-desktop')) cuonToiBaiDangPhat(true);
  }

  // Cuộn #music-results cho bài đang phát nằm giữa vùng nhìn (dưới thanh thẻ ghim).
  function cuonToiBaiDangPhat(muot) {
    const vung = document.getElementById('music-results');
    const li = document.querySelector('#music-dp-ds li.dang-phat');
    if (!vung || !li || li.offsetParent === null) return;
    const rv = vung.getBoundingClientRect(), rl = li.getBoundingClientRect();
    const dich = vung.scrollTop + rl.top - rv.top - (rv.height - rl.height) / 2;
    vung.scrollTo({ top: Math.max(0, dich), behavior: muot ? 'smooth' : 'auto' });
  }

  // Đổi thẻ Tiếp theo / Liên quan: chỉ ẩn/hiện 2 ngăn có sẵn, KHÔNG vẽ lại trang.
  function chonTheDangPhat(the) {
    dpThe = the;
    document.querySelectorAll('#music-results .mdp-the a').forEach((a) => a.classList.toggle('active', a.dataset.the === the));
    document.querySelectorAll('#music-results .mdp-ngan').forEach((n) => { n.hidden = n.dataset.ngan !== the; });
    if (the === 'lien_quan') {
      const ulLq = document.getElementById('music-dp-lq');
      if (ulLq && ulLq.dataset.bai !== dpBai.id) veLienQuan(ulLq, dpBai, dpDs);
    } else {
      cuonToiBaiDangPhat(true);
    }
  }
  async function veDangPhat(ul) {
    const luot = ++dpLuot;            // vẽ lại liên tiếp (đổi bài/đổi thẻ) -> chỉ lượt mới nhất được vẽ
    const { ds, i, trenMay } = await layHangCho();
    if (tabDangXem !== 'dang_phat' || luot !== dpLuot) return;
    ul.innerHTML = '';
    dpDs = ds;
    const bai = ds[i] || baiKhungPhat || {};
    const tenNguon = (trenMay ? tenHangChoMay : (hangChoPi || {}).query) || 'Danh sách đang phát';
    const goiY = trenMay ? hangChoGoiY : (hangChoPi || {}).goi_y !== false;
    const li = document.createElement('li');
    li.className = 'mdp-khung' + (dpHieuUng ? ' mdp-vao' : '');
    dpHieuUng = false;
    li.innerHTML =
      '<div class="mdp-trai"><div class="mdp-tieu-de">Đang phát</div><div class="mdp-noi">' + (trenMay ? tenMayNay() : noiPhatTen) + '</div>' +
        '<div class="mdp-anh"><img alt="" /></div>' +
        '<div class="mdp-ten"></div><div class="mdp-kenh music-bai-phu"></div></div>' +
      '<div class="mdp-phai">' +
        '<div class="mdp-the"><a href="#" data-the="tiep">Tiếp theo</a><a href="#" data-the="lien_quan">Liên quan</a></div>' +
        '<div class="mdp-noi-dung"></div></div>';
    const img = li.querySelector('.mdp-anh img');
    if (bai.id) {
      // maxres thiếu -> 404 kèm ảnh xám 120x90 (onerror không chạy): xem kích thước.
      const hq = 'https://i.ytimg.com/vi/' + encodeURIComponent(bai.id) + '/hqdefault.jpg';
      img.onload = () => { if (img.naturalWidth <= 120 && img.src !== hq) img.src = hq; };
      img.onerror = () => { img.onerror = null; if (img.src !== hq) img.src = hq; };
      img.src = 'https://i.ytimg.com/vi/' + encodeURIComponent(bai.id) + '/maxresdefault.jpg';
    }
    li.querySelector('.mdp-ten').textContent = bai.title || '';
    if (bai.id) veDongPhuBai(li.querySelector('.mdp-kenh'), bai, true);
    dpBai = bai;
    li.querySelector('.mdp-kenh').addEventListener('click', (e) => { if (e.target.closest('.music-kenh')) moKenh(dpBai); });
    // Bấm ảnh bìa = Phát/Tạm dừng (như nút Phát ở thanh phát).
    li.querySelector('.mdp-anh').addEventListener('click', () => { rungNhe(); togglePlayPause(); });
    li.querySelectorAll('.mdp-the a').forEach((a) => {
      a.classList.toggle('active', a.dataset.the === dpThe);
      a.addEventListener('click', (e) => { e.preventDefault(); if (a.dataset.the === dpThe) return; rungNhe(); chonTheDangPhat(a.dataset.the); });
    });
    const nd = li.querySelector('.mdp-noi-dung');
    ul.appendChild(li);
    if (document.documentElement.classList.contains('device-desktop')) datChipVao(li.querySelector('.mdp-trai'));
    {
      nd.innerHTML =
        '<div class="mdp-ngan" data-ngan="tiep"' + (dpThe === 'tiep' ? '' : ' hidden') + '>' +
        '<div class="mdp-nguon"><div class="mdp-nguon-chu"><div class="mdp-nhan">Đang phát từ</div><div class="mdp-nguon-ten"></div></div>' +
          '<a href="#" class="button button-round mdp-luu"><i class="icon f7-icons">music_note_list</i><span>Lưu</span></a></div>' +
        '<label class="mdp-tu-phat"><div><div class="mdp-tu-phat-ten">Tự phát</div><div class="mdp-nhan">Thêm bài tương tự vào cuối danh sách</div></div>' +
          '<span class="toggle"><input type="checkbox"' + (goiY ? ' checked' : '') + ' /><span class="toggle-icon"></span></span></label>' +
        '<ul class="music-ds-bai music-hang-cho" id="music-dp-ds"></ul><span id="music-dp-so" hidden></span></div>' +
        '<div class="mdp-ngan" data-ngan="lien_quan"' + (dpThe === 'lien_quan' ? '' : ' hidden') + '>' +
          '<ul class="music-ds-bai music-hang-cho" id="music-dp-lq"></ul></div>';
      nd.querySelector('.mdp-nguon-ten').textContent = tenNguon;
      nd.querySelector('.mdp-luu').addEventListener('click', (e) => { e.preventDefault(); luuHangChoThanhPlaylist(ds, tenNguon); });
      nd.querySelector('.mdp-tu-phat input').addEventListener('change', (e) => datTuPhat(e.target.checked, trenMay));
      veHangChoVao(document.getElementById('music-dp-ds'), document.getElementById('music-dp-so'), { ds, i, trenMay });
      if (dpThe === 'lien_quan') veLienQuan(nd.querySelector('#music-dp-lq'), bai, ds);
      // Máy tính: danh sách cuộn tới bài đang phát ngay khi vào. Điện thoại
      // giữ ảnh lớn ở đầu, cuộn khi chạm thẻ Tiếp theo.
      else if (document.documentElement.classList.contains('device-desktop')) requestAnimationFrame(() => cuonToiBaiDangPhat(false));
    }
  }

  async function veLienQuan(ulLq, bai, ds) {
    if (!bai.id) return;
    ulLq.dataset.bai = bai.id;
    if (!lienQuanCache[bai.id]) {
      ulLq.innerHTML = '<li class="mdp-cho">Đang tìm bài liên quan...</li>';
      try {
        const bo = ds.map((b) => b.id).join(',');
        lienQuanCache[bai.id] = (await api('/api/music/related?id=' + encodeURIComponent(bai.id) + '&bo_qua=' + encodeURIComponent(bo))).results || [];
      } catch (e) { lienQuanCache[bai.id] = []; }
      if (!document.body.contains(ulLq) || ulLq.dataset.bai !== bai.id) return;
    }
    ulLq.innerHTML = '';
    const lq = lienQuanCache[bai.id];
    if (!lq.length) { ulLq.innerHTML = '<li class="mdp-cho">Không tìm được bài liên quan.</li>'; return; }
    lq.forEach((b) => {
      const li = document.createElement('li');
      li.className = 'music-bai-dong';
      li.innerHTML = '<span class="music-bai-anh"><img alt="" /></span><span class="music-bai-chu"><span class="music-bai-ten"></span><span class="music-bai-phu"></span></span>';
      li.querySelector('img').src = 'https://i.ytimg.com/vi/' + encodeURIComponent(b.id) + '/mqdefault.jpg';
      li.querySelector('.music-bai-ten').textContent = b.title || '';
      veDongPhuBai(li.querySelector('.music-bai-phu'), b, false);
      li.addEventListener('click', (e) => { if (e.target.closest('.music-kenh')) { moKenh(b); return; } rungNhe(); phatNgayBai(b); });
      ganTaiTruocKhiRe(li, b);
      ulLq.appendChild(li);
    });
  }

  // Chạm bài ở thẻ Liên quan: chèn ngay sau bài đang nghe rồi chuyển tới nó.
  async function phatNgayBai(b) {
    if (dangPhatTrenMay()) {
      hangChoMay.splice(viTriMay + 1, 0, b);
      phatBaiTrenMay(viTriMay + 1);
      setTimeout(veKetQua, 300);
      return;
    }
    try {
      const ok = (await api('/api/music/queue/add', { method: 'POST', body: JSON.stringify({ bai: b, tiep_theo: true }) })).ok;
      if (ok) await api('/api/music/next', { method: 'POST' });
      else phatDanhSach([b], 0, b.title || '');
    } catch (e) { baoLoi(e); }
  }

  async function datTuPhat(bat, trenMay) {
    rungNhe();
    if (trenMay) { hangChoGoiY = bat; return; }
    try {
      await api('/api/music/queue/goi_y', { method: 'POST', body: JSON.stringify({ bat }) });
      if (hangChoPi) hangChoPi.goi_y = bat;
    } catch (e) { baoLoi(e); }
  }

  function luuHangChoThanhPlaylist(ds, tenGoiY) {
    if (!ds.length) return;
    $f7.dialog.prompt('Lưu ' + ds.length + ' bài đang phát thành danh sách phát', 'Lưu danh sách', async (ten) => {
      if (!(ten || '').trim()) return;
      try {
        const data = await api('/api/music/playlists', { method: 'POST', body: JSON.stringify({ ten, bai: ds, may_id: MAY_ID }) });
        dsPlaylist = data.playlists || dsPlaylist;
        rungNhe();
        $f7.toast.show({ text: 'Đã lưu "' + esc(ten.trim()) + '"', closeTimeout: 1500 });
      } catch (e) { baoLoi(e); }
    }, null, String(tenGoiY || '').slice(0, 60));
  }

  // Máy tính, tab Đang phát: hàng chip nằm ĐẦU CỘT TRÁI để cột Tiếp theo /
  // Liên quan bên phải ngang hàng chip (không kéo cột phải chồng lên đầu trang
  // được - vùng danh sách cắt phần tràn). Trả về đầu trang TRƯỚC khi xoá nội
  // dung (chip nằm trong nội dung sẽ bị xoá mất cùng).
  function datChipVao(noi) {
    const tab = document.getElementById('music-tab');
    if (tab && noi && tab.parentElement !== noi) noi.prepend(tab);
  }

  function veKetQua() {
    const ul = document.querySelector('#music-results ul');
    datChipVao(document.querySelector('#music-list-card .music-ds-dau'));
    ul.innerHTML = '';
    if (dangTim && tabDangXem === 'tim') {
      veSkeletonTim(ul, ketQuaLaTim);
      capNhatDauCard();
      // Dòng phụ dưới tiêu đề đã ghi "Đang tìm..." - bỏ dòng trạng thái riêng
      // để skeleton nằm ĐÚNG chỗ dữ liệu thật sẽ hiện (không nhảy 44px).
      baoTrangThaiTim('');
      return;
    }
    if (tabDangXem === 'kham_pha') {
      veKhamPha(ul);
      capNhatDauCard();
      danhDauBaiDangPhat();
      return;
    }
    if (tabDangXem === 'dang_phat') {
      veDangPhat(ul);
      capNhatDauCard();
      return;
    }
    if (tabDangXem === 'yeu_thich') veHangPlaylist(ul);
    if (laKetQuaTimThat() && ketQuaTim.length) {
      veChipLoc(ul, ketQuaTim);
      if (locTim === 'tat_ca') veHangDau(ul, ketQuaTim);
    }
    dsDangXem().forEach((bai, i) => {
      const li = document.createElement('li');
      li.className = 'music-bai-dong';
      li.dataset.title = bai.title || '';
      li.dataset.id = bai.id || '';
      li.innerHTML =
        '<a href="#" class="music-bai-anh music-bai"><img alt="" />' +
          '<span class="music-choi"><i class="icon f7-icons">play_fill</i></span>' +
          '<span class="music-song"><i></i><i></i><i></i></span>' +
          '<span class="music-tai"><span class="preloader">' + htmlPreloader() + '</span></span></a>' +
        '<div class="music-bai-chu"><span class="music-bai-ten"></span><span class="music-bai-phu"></span></div>' +
        '<a href="#" class="link icon-only music-tim" title="Yêu thích"><i class="icon f7-icons"></i></a>' +
        '<a href="#" class="link icon-only music-them" title="Tuỳ chọn"><i class="icon f7-icons">ellipsis</i></a>';
      li.querySelector('img').src = 'https://i.ytimg.com/vi/' + encodeURIComponent(bai.id) + '/mqdefault.jpg';
      li.querySelector('.music-bai-ten').textContent = bai.title;
      // Tên kênh/ca sĩ CHẠM ĐƯỢC (có channel_id) -> mở danh sách bài của kênh.
      veDongPhuBai(li.querySelector('.music-bai-phu'), bai, laKetQuaTimThat());
      const tim = li.querySelector('.music-tim');
      const co = laYeuThich(bai.id);
      tim.querySelector('i').textContent = co ? 'heart_fill' : 'heart';
      tim.classList.toggle('da-thich', co);
      tim.addEventListener('click', (e) => { e.preventDefault(); doiYeuThich(bai); });
      li.querySelector('.music-them').addEventListener('click', (e) => { e.preventDefault(); moMenuBai(bai, e.currentTarget); });
      li.addEventListener('pointerdown', (e) => { if (!e.target.closest('.music-them, .music-tim, .music-kenh')) taiTruoc([bai]); }, { passive: true });
      ganTaiTruocKhiRe(li, bai);
      li.querySelector('.music-bai').addEventListener('click', (e) => { e.preventDefault(); phatKetQua(i); });
      li.querySelector('.music-bai-chu').addEventListener('click', (e) => {
        if (e.target.closest('.music-kenh')) moKenh(bai);
        else phatKetQua(i);
      });
      ul.appendChild(li);
    });
    danhDauBaiDangPhat();
    capNhatDauCard();
  }

  async function doiYeuThich(bai) {
    const them = !laYeuThich(bai.id);
    rungNhe();
    try {
      const data = await api('/api/music/favorites', { method: 'POST', body: JSON.stringify({ bai, them, may_id: MAY_ID }) });
      dsYeuThich = data.results || [];
      if (tabDangXem === 'kham_pha') {
        document.querySelectorAll('#music-results .mkp-the[data-id]').forEach((the) => {
          const co = laYeuThich(the.dataset.id);
          const t = the.querySelector('.mkp-tim');
          if (t) { t.classList.toggle('da-thich', co); t.querySelector('i').textContent = co ? 'heart_fill' : 'heart'; }
        });
        veLaiHangKhamPha('yeu_thich');
        document.getElementById('music-fav-count').textContent = dsYeuThich.length;
      } else {
        veKetQua();
      }
      capNhatTimKhungPhat();
      $f7.toast.show({ text: them ? 'Đã thêm vào yêu thích' : 'Đã bỏ khỏi yêu thích', closeTimeout: 1500 });
    } catch (e) {
      baoLoi(e);
    }
  }

  // Kết quả tìm / trang kênh lưu RIÊNG trên máy này (localStorage) - 2 điện
  // thoại tìm bài khác nhau không đè danh sách của nhau. Máy chưa có (lần đầu)
  // thì lấy danh sách chung cũ trên server (/api/music/list).
  const KHOA_KET_QUA = 'music_ket_qua_tim';
  function luuKetQuaMay() {
    try { localStorage.setItem(KHOA_KET_QUA, JSON.stringify({ query: tuKhoaTim, results: ketQuaTim.slice(0, 50), laTim: ketQuaLaTim })); } catch (e) { /* đầy/riêng tư */ }
  }
  function docKetQuaMay() {
    try {
      const d = JSON.parse(localStorage.getItem(KHOA_KET_QUA) || 'null');
      return d && Array.isArray(d.results) ? d : null;
    } catch (e) { return null; }
  }

  async function timBai() {
    const input = document.getElementById('music-query');
    const q = input.value.trim();
    if (!q) return;
    anGoiY();
    input.blur();
    if (musicSearchbar) musicSearchbar.disable();
    ketQuaTim = [];
    tuKhoaTim = q;
    ketQuaLaTim = true;
    locTim = 'tat_ca';
    hienChipTim(true);
    dangTim = true;
    chonTab('tim');
    // (dòng phụ dưới tiêu đề đã ghi "Đang tìm trên YouTube..." - không thêm dòng trạng thái, skeleton nằm đúng chỗ)
    try {
      const data = await api('/api/music/search?q=' + encodeURIComponent(q));
      ketQuaTim = data.results || [];
      dangTim = false;
      luuKetQuaMay();
      veKetQua();
      if (!ketQuaTim.length) baoTrangThaiTim('Không tìm thấy bài nào.');
    } catch (e) {
      dangTim = false;
      veKetQua();
      baoLoi(e);
    }
  }

  // Chạm tên ca sĩ/kênh ở 1 dòng bài -> video mới nhất của kênh đó
  // (/api/music/channel - server tự lưu làm danh sách phát "Kênh: <tên>").
  async function moKenh(bai) {
    rungNhe();
    ketQuaTim = [];
    tuKhoaTim = 'Kênh: ' + (bai.channel || '');
    ketQuaLaTim = false;
    locTim = 'tat_ca';
    hienChipTim(true);
    dangTim = true;
    chonTab('tim');
    document.getElementById('music-results').scrollTop = 0;
    try {
      const data = await api('/api/music/channel?id=' + encodeURIComponent(bai.channel_id));
      ketQuaTim = data.results || [];
      tuKhoaTim = 'Kênh: ' + (data.channel || bai.channel || '');
      dangTim = false;
      luuKetQuaMay();
      veKetQua();
      if (!ketQuaTim.length) baoTrangThaiTim('Kênh này chưa có video nào.');
    } catch (e) {
      dangTim = false;
      veKetQua();
      baoLoi(e);
    }
  }

  // Danh sách đã lưu trên server: kết quả tìm gần nhất + bài yêu thích.
  async function taiDanhSachDaLuu() {
    try {
      const may = docKetQuaMay();
      const [ds, yt, pls] = await Promise.all([may ? Promise.resolve(may) : api('/api/music/list'), api('/api/music/favorites?may=' + encodeURIComponent(MAY_ID)), api('/api/music/playlists?may=' + encodeURIComponent(MAY_ID))]);
      ketQuaTim = ds.results || [];
      tuKhoaTim = ds.query || '';
      ketQuaLaTim = ds.laTim !== undefined ? !!ds.laTim : !tuKhoaTim.startsWith('Kênh: ');
      // Lần đầu (lấy danh sách chung của server) -> giữ luôn làm danh sách
      // RIÊNG của máy này, không thì máy khác tìm bài là danh sách này đổi theo.
      if (!may) luuKetQuaMay();
      dsYeuThich = yt.results || [];
      dsPlaylist = pls.playlists || [];
    } catch (e) { /* chưa có/không đọc được thì để trống */ }
    // Chưa từng tìm mà đã có bài yêu thích -> mở sẵn tab Yêu thích.
    chonTab(tabDangXem, true);
    taiKhamPha();
  }

  // ---------- Hàng chờ (thẻ "Tiếp theo" ở tab Đang phát): bài đang phát đánh
  // dấu, chạm 1 bài để nhảy tới. Lấy đúng nơi đang phát: Máy này (hangChoMay)
  // hay Loa Pi (/api/music/queue). ----------
  let hangChoPi = null;          // {query, index, entries, goi_y} lần đọc gần nhất

  async function layHangCho() {
    if (dangPhatTrenMay()) return { ds: hangChoMay, i: viTriMay, trenMay: true };
    try {
      hangChoPi = await api('/api/music/queue');
    } catch (e) { hangChoPi = null; }
    const ds = (hangChoPi && hangChoPi.entries) || [];
    return { ds, i: Number((hangChoPi || {}).index) || 0, trenMay: false };
  }

  // Vẽ lại danh sách ở tab Đang phát (sau khi hàng chờ đổi: trộn, chèn bài,
  // nhảy bài). khongDangPhat: bỏ qua (đổi bài thì tab tự cập nhật tại chỗ).
  async function veHangCho(khongDangPhat) {
    if (khongDangPhat || tabDangXem !== 'dang_phat' || !document.getElementById('music-dp-ds')) return;
    const duLieu = await layHangCho();
    veHangChoVao(document.getElementById('music-dp-ds'), document.getElementById('music-dp-so'), duLieu);
  }

  function veHangChoVao(ul, phu, { ds, i, trenMay }) {
    if (!ul) return;
    ul.innerHTML = '';
    phu.textContent = ds.length
      ? (trenMay ? 'Máy này' : noiPhatTen) + ' · ' + ds.length + ' bài' : 'Chưa có bài nào đang phát';
    ds.forEach((bai, k) => {
      const li = document.createElement('li');
      li.className = 'music-bai-dong' + (k === i ? ' dang-phat' : '') + (k === i && musicState !== 'playing' ? ' tam-dung' : '');
      li.dataset.id = bai.id || '';
      if (k < i) li.classList.add('da-qua');
      li.innerHTML =
        '<span class="music-bai-anh"><img alt="" /><span class="music-song"><i></i><i></i><i></i></span></span>' +
        '<span class="music-bai-chu"><span class="music-bai-ten"></span><span class="music-bai-phu"></span></span>';
      li.querySelector('img').src = 'https://i.ytimg.com/vi/' + encodeURIComponent(bai.id) + '/mqdefault.jpg';
      li.querySelector('.music-bai-ten').textContent = bai.title;
      li.querySelector('.music-bai-phu').textContent =
        [bai.channel || '', bai.duration ? fmtTime(bai.duration) : ''].filter(Boolean).join(' · ');
      li.addEventListener('click', () => {
        // Theo vạch sáng HIỆN TẠI (tab Đang phát dời vạch tại chỗ khi đổi bài).
        if (li.classList.contains('dang-phat')) return;
        rungNhe();
        nhayToiBaiHangCho(k, trenMay);
      });
      ul.appendChild(li);
    });
  }

  function nhayToiBaiHangCho(k, trenMay) {
    if (trenMay) {
      phatBaiTrenMay(k);
      setTimeout(veHangCho, 300);
      return;
    }
    const q = hangChoPi || {};
    api('/api/music/play_item', {
      method: 'POST',
      body: JSON.stringify({ query: q.query || '', index: k, entries: q.entries || [], goi_y: q.goi_y !== false, thong_bao: false, may_id: q.chu || '' }),
    }).then(() => setTimeout(veHangCho, 1500)).catch((e) => baoLoi(e));
  }

  // ---------- Thao tác danh sách phát ----------
  // Actions/toast của F7 hiển thị chữ dạng HTML - escape tên bài/danh sách
  // (lấy từ YouTube/người dùng nhập) trước khi đưa vào.
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  // Yêu thích + danh sách phát lưu RIÊNG từng máy (mã máy gửi kèm - xem MAY_ID).
  async function guiPlaylist(url, body) {
    const data = await api(url, { method: 'POST', body: JSON.stringify(Object.assign({ may_id: MAY_ID }, body)) });
    dsPlaylist = data.playlists || dsPlaylist;
    // Vừa xoá playlist đang mở -> về tab Yêu thích.
    if (tabDangXem === 'ds' && !plDangMo()) chonTab('yeu_thich');
    else veKetQua();
    return data;
  }

  // Tạo danh sách mới (hỏi tên); baiThem: bài vừa chọn "Thêm vào..." -> thêm luôn.
  function taoPlaylist(baiThem) {
    $f7.dialog.prompt('Đặt tên cho danh sách phát', 'Tạo danh sách phát', async (ten) => {
      if (!(ten || '').trim()) return;
      try {
        const data = await guiPlaylist('/api/music/playlists', { ten });
        if (baiThem && data.playlist) await themVaoPlaylist(data.playlist.id, baiThem);
        else $f7.toast.show({ text: 'Đã tạo "' + esc(ten.trim()) + '"', closeTimeout: 1500 });
      } catch (e) { baoLoi(e); }
    });
  }

  async function themVaoPlaylist(plId, bai) {
    try {
      await guiPlaylist('/api/music/playlists/' + plId, { bai, them: true });
      const pl = dsPlaylist.find((p) => p.id === plId);
      rungNhe();
      $f7.toast.show({ text: 'Đã thêm vào "' + esc(pl ? pl.ten : '') + '"', closeTimeout: 1500 });
    } catch (e) { baoLoi(e); }
  }

  // Menu của nút ⋯ (đầu danh sách phát đang mở): F7 Actions hiện thành POPOVER bám ngay nút vừa bấm
  // (forceToPopover - cả điện thoại lẫn máy tính) thay vì trượt từ đáy lên.
  // Popover chạm ra ngoài là đóng nên bỏ nhóm "Đóng". Không có nút (gọi từ chỗ
  // khác) thì vẫn là Actions thường.
  function moMenu(nhom, nutGoc) {
    if (nutGoc && document.body.contains(nutGoc)) {
      return $f7.actions.create({ buttons: nhom, targetEl: nutGoc, convertToPopover: true, forceToPopover: true }).open();
    }
    return $f7.actions.create({ buttons: [...nhom, [{ text: 'Đóng' }]] }).open();
  }

  // ---------- Menu ⋯ của 1 bài - kiểu Tidal ----------
  // Máy tính (>= 630px): popover bám nút ⋯ (đầu: ảnh nhỏ + tên + kênh, mục
  // căn trái, mục có menu con thì có ›). Điện thoại: màn tối toàn trang (F7
  // popup) - ảnh bìa, mục có icon, "Đóng" ở cuối, vuốt xuống để đóng. Cùng 1 nội dung
  // (htmlMenuBai); "Thêm vào danh sách phát" mở danh sách NGAY TRONG menu.
  function mucMenuBai(bai, coDung) {
    const pl = tabDangXem === 'ds' ? plDangMo() : null;
    const co = laYeuThich(bai.id);
    const m = [
      ['pl', 'music_note_list', 'Thêm vào danh sách phát', true],
      ['tim', co ? 'heart_fill' : 'heart', co ? 'Bỏ khỏi Yêu thích' : 'Thêm vào Yêu thích'],
      ['tiep', 'text_insert', 'Phát tiếp theo'],
      ['cuoi', 'text_append', 'Thêm vào hàng chờ'],
      ['radio', 'dot_radiowaves_left_right', 'Phát radio từ bài này'],
    ];
    if (bai.channel && bai.channel_id) m.push(['kenh', 'person', 'Xem kênh ' + bai.channel, true]);
    m.push(['chia_se', 'square_arrow_up', 'Chia sẻ']);
    if (pl) m.push(['xoa_pl', 'minus_circle', 'Xoá khỏi "' + pl.ten + '"']);
    if (coDung) m.push(['dung', 'stop_circle', 'Dừng phát']);
    return m;
  }

  function htmlMucMenu(hd, icon, ten, them) {
    return '<a href="#" class="mmb-muc' + (hd === 'xoa_pl' || hd === 'dung' ? ' mmb-do' : '') + '" data-hd="' + esc(hd) + '">' +
      '<i class="icon f7-icons">' + icon + '</i><span>' + esc(ten) + '</span>' + (them || '') + '</a>';
  }

  function htmlMenuBai(bai, trang, coDung) {
    const anh = 'https://i.ytimg.com/vi/' + encodeURIComponent(bai.id) + '/hqdefault.jpg';
    let ds;
    if (trang === 'pl') {
      ds = htmlMucMenu('lui', 'chevron_left', 'Thêm vào danh sách phát') +
        dsPlaylist.map((p) => htmlMucMenu('pl:' + p.id, 'music_note_list', p.ten, '<em>' + (p.bai || []).length + '</em>')).join('') +
        htmlMucMenu('pl_moi', 'plus', 'Tạo danh sách mới');
    } else {
      ds = mucMenuBai(bai, coDung).map(([hd, icon, ten, con]) =>
        htmlMucMenu(hd, icon, ten, con ? '<i class="icon f7-icons mmb-con">chevron_right</i>' : '')).join('');
    }
    return '<div class="mmb-dau"><span class="mmb-anh" style="background-image:url(\'' + anh + '\')"></span>' +
      '<div class="mmb-chu"><div class="mmb-ten">' + esc(bai.title) + '</div><div class="mmb-phu">' + esc(bai.channel || '') + '</div></div></div>' +
      '<div class="mmb-ds' + (trang === 'pl' ? ' mmb-ds-pl' : '') + '">' + ds + '</div>';
  }

  // coDung: mở từ thanh phát (bài đang phát) -> thêm "Dừng phát".
  function moMenuBai(bai, nutGoc, coDung) {
    const rong = !!nutGoc && window.innerWidth >= 630;
    const modal = rong
      ? $f7.popover.create({
          targetEl: nutGoc,
          content: '<div class="popover music-menu-bai"><div class="popover-inner"><div class="mmb-vung"></div></div></div>',
          on: { closed: (m) => m.destroy() },
        })
      : $f7.popup.create({
          swipeToClose: 'to-bottom',       // vuốt xuống là đóng
          content: '<div class="popup music-menu-bai music-menu-bai-dt"><div class="mmb-vung"></div><a href="#" class="mmb-huy" title="Đóng" aria-label="Đóng"><i class="icon f7-icons">xmark</i></a></div>',
          on: { closed: (m) => m.destroy() },
        });
    const vung = modal.el.querySelector('.mmb-vung');
    const ve = (trang) => { vung.innerHTML = htmlMenuBai(bai, trang, coDung); if (rong && modal.opened) modal.resize(); };
    ve('chinh');
    modal.el.addEventListener('click', (e) => {
      if (e.target.closest('.mmb-huy')) { e.preventDefault(); modal.close(); return; }
      const a = e.target.closest('[data-hd]');
      if (!a) return;
      e.preventDefault();
      const hd = a.dataset.hd;
      if (hd === 'pl') { ve('pl'); return; }
      if (hd === 'lui') { ve('chinh'); return; }
      modal.close();
      thucHienMenuBai(hd, bai);    // chạy NGAY trong lúc chạm (navigator.share cần)
    });
    modal.open();
  }

  function thucHienMenuBai(hd, bai) {
    const pl = tabDangXem === 'ds' ? plDangMo() : null;
    if (hd === 'tim') doiYeuThich(bai);
    else if (hd.startsWith('pl:')) themVaoPlaylist(hd.slice(3), bai);
    else if (hd === 'pl_moi') taoPlaylist(bai);
    else if (hd === 'tiep' || hd === 'cuoi') chenHangCho(bai, hd === 'tiep');
    // Radio: phát riêng bài này, hết bài tự nối bài liên quan (YouTube Mix).
    else if (hd === 'radio') phatDanhSach([bai], 0, 'Radio: ' + (bai.title || ''));
    else if (hd === 'kenh') moKenh(bai);
    else if (hd === 'chia_se') chiaSeBai(bai);
    else if (hd === 'xoa_pl' && pl) xoaKhoiPlaylist(pl, bai);
    else if (hd === 'dung') stopMusic();
  }

  // "Phát tiếp theo" / "Thêm vào hàng chờ": Máy này sửa hàng chờ tại chỗ; Loa
  // Pi qua /api/music/queue/add. Chưa phát gì thì phát luôn bài đó.
  async function chenHangCho(bai, tiepTheo) {
    rungNhe();
    if (dangPhatTrenMay()) {
      hangChoMay.splice(tiepTheo ? viTriMay + 1 : hangChoMay.length, 0, bai);
    } else {
      const st = trangThaiPiCuoi && trangThaiPiCuoi.state;
      let ok = false;
      if (st === 'playing' || st === 'paused') {
        try {
          ok = (await api('/api/music/queue/add', { method: 'POST', body: JSON.stringify({ bai, tiep_theo: tiepTheo }) })).ok;
        } catch (e) { baoLoi(e); return; }
      }
      if (!ok) { phatDanhSach([bai], 0, bai.title || ''); return; }
    }
    $f7.toast.show({ text: tiepTheo ? 'Sẽ phát tiếp theo' : 'Đã thêm vào hàng chờ', closeTimeout: 1500 });
    veHangCho();
  }

  // Chia sẻ link YouTube: bảng chia sẻ của máy nếu có; web UI chạy http (không
  // phải https) thì trình duyệt khoá navigator.share/clipboard -> chép kiểu cũ.
  function chiaSeBai(bai) {
    const url = 'https://youtu.be/' + bai.id;
    if (navigator.share) {
      navigator.share({ title: bai.title, url }).catch(() => {});
      return;
    }
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    let chep = false;
    try { chep = document.execCommand('copy'); } catch (e) { chep = false; }
    ta.remove();
    if (chep) $f7.toast.show({ text: 'Đã chép link bài hát', closeTimeout: 1500 });
    else $f7.dialog.alert(esc(url), 'Link bài hát');
  }

  function xoaKhoiPlaylist(pl, bai) {
    $f7.dialog.confirm(esc(bai.title), 'Xoá khỏi "' + esc(pl.ten) + '"?', () => {
      guiPlaylist('/api/music/playlists/' + pl.id, { bai, them: false }).catch((e) => baoLoi(e));
    });
  }

  // Nút ⋯ của danh sách đang mở: đổi tên / xoá.
  function moMenuPlaylist(nutGoc) {
    const pl = plDangMo();
    if (!pl) return;
    moMenu([[
      { text: 'Đổi tên', onClick: () => {
        $f7.dialog.prompt('Tên mới', 'Đổi tên danh sách', (ten) => {
          if ((ten || '').trim()) guiPlaylist('/api/music/playlists/' + pl.id, { ten }).catch((e) => baoLoi(e));
        }, null, pl.ten);
      } },
      { text: 'Xoá danh sách phát', color: 'red', onClick: () => {
        $f7.dialog.confirm('Xoá "' + esc(pl.ten) + '"? Các bài trong đó vẫn còn ở nơi khác.', 'Xoá danh sách phát', () => {
          guiPlaylist('/api/music/playlists/' + pl.id, { xoa: true }).catch((e) => baoLoi(e));
        });
      } },
    ]], nutGoc);
  }

  function phatKetQua(i) {
    const tuTrangTim = tabDangXem === 'tim';
    phatDanhSach(dsDangXem().slice(), i, tenDanhSachDangXem());
    // Nghe từ trang tìm -> ẩn trang tìm, sang tab "Đang phát" (ảnh lớn + danh
    // sách tiếp theo, kiểu YouTube Music) - hàng chờ chính là danh sách vừa
    // tìm. Máy này có hàng chờ ngay; Loa Pi tự vẽ lại khi Pi đổi bài.
    if (tuTrangTim) {
      hienChipTim(false);
      moTrangDangPhat();
    }
  }

  async function phatDanhSach(ds, i, ten) {
    // Mọi nguồn: hết danh sách thì tự gợi ý bài liên quan (radio kiểu Tidal).
    // Yêu thích / danh sách tự tạo: ưu tiên phát HẾT danh sách trước - bấm bài
    // giữa thì xoay vòng (bài đó -> cuối -> các bài phía trên) rồi mới gợi ý.
    const goiY = true;
    if ((tabDangXem === 'yeu_thich' || tabDangXem === 'ds') && i > 0) { ds = ds.slice(i).concat(ds.slice(0, i)); i = 0; }
    datBaiDangMo(ds[i]);
    if (cheDoPhat === 'may') {
      rungNhe();
      hangChoMay = ds;
      hangChoGoiY = goiY;
      tenHangChoMay = ten || '';
      datLaiTronMay();
      phatBaiTrenMay(i);
      return;
    }
    // Loa Pi: không che màn hình bằng hộp thoại "Đang mở bài..." nữa - loader
    // hiện ngay trên ảnh bài vừa chạm (datBaiDangMo) cho tới khi Pi phát.
    try {
      const truoc = await api('/api/music/status');
      await api('/api/music/play_item', { method: 'POST', body: JSON.stringify({ query: ten, index: i, entries: ds, goi_y: goiY, may_id: MAY_ID }) });
      rungNhe();
      await choToiKhiPhatXongBaiMoi(truoc.title);
    } catch (e) {
      datBaiDangMo(null);
      baoLoi(e);
    } finally {
      loadMusicStatus();
    }
  }

  async function stopMusic() {
    if (dangPhatTrenMay()) { dungTrenMay(); return; }
    try {
      await api('/api/music/stop', { method: 'POST' });
    } catch (e) {
      baoLoi(e);
    } finally {
      loadMusicStatus();
    }
  }

  // Nút Phát/Tạm dừng chung - đọc icon hiện tại để biết đang phát hay đang dừng
  // mà gọi đúng API tương ứng (dùng lại cơ chế tam_dung()/tiep_tuc() vốn đã có
  // sẵn cho việc nhường loa lúc TTS nói).
  async function togglePlayPause() {
    if (dangPhatTrenMay()) { batTatTrenMay(); return; }
    if (Date.now() < dangChuyenBaiPi) return;        // đang chờ Pi xử lý lệnh trước - khỏi bấm trùng
    const dangPhat = document.getElementById('music-playpause-icon').textContent === 'pause_fill';
    // Vòng xoay ở nút Phát (thanh phát, mini player, trình phát mở rộng) trong
    // lúc chờ Pi dừng/phát tiếp (phát tiếp còn phải lấy lại link ~1-3s).
    dangChuyenBaiPi = Date.now() + 20000;
    danhDauBaiDangPhat();
    try {
      await api(dangPhat ? '/api/music/pause' : '/api/music/resume', { method: 'POST' });
    } catch (e) {
      baoLoi(e);
    } finally {
      await loadMusicStatus();
      dangChuyenBaiPi = 0;
      danhDauBaiDangPhat();
    }
  }

  async function skipMusic(path) {
    if (dangPhatTrenMay()) { chuyenBaiTrenMay(path.endsWith('/next')); return; }
    // Vòng xoay ngay ở nút Phát (thanh phát, mini player, trình phát mở rộng)
    // thay cho hộp thoại "Đang chuyển bài..." che màn hình.
    dangChuyenBaiPi = Date.now() + 20000;
    danhDauBaiDangPhat();
    try {
      const data = await api(path, { method: 'POST' });
      if (data.message) $f7.toast.show({ text: data.message, closeTimeout: 2000 });
    } catch (e) {
      baoLoi(e);
    } finally {
      await loadMusicStatus();
      dangChuyenBaiPi = 0;
      danhDauBaiDangPhat();
    }
  }

  $on('pageInit', () => {
    // Searchbar thật của F7 (cùng cách tạo với devices.html) - customSearch:
    // tự xử lý (gợi ý/tìm qua API), F7 chỉ lo phần mở/đóng/xoá chữ.
    try {
      musicSearchbar = $f7.searchbar.create({
        el: '#music-searchbar',
        customSearch: true,
        expandable: true,
        // Đúng chuẩn F7 (như searchbar trang Thiết bị): CÓ backdrop - chạm ra
        // ngoài (vào lớp mờ) thì F7 tự đóng thanh tìm, về lại navbar thường.
        // Trước đây tắt backdrop nên chạm ra ngoài thanh tìm vẫn mở mãi.
        backdrop: true,
        on: {
          search(sb, query) {
            clearTimeout(goiYTimer);
            goiYTimer = setTimeout(() => layGoiY(query.trim()), 250);
          },
          clear() { anGoiY(); },
          disable() { anGoiY(); },
        },
      });
    } catch (e) {
      console.error('Lỗi khởi tạo searchbar nhạc:', e);
    }
    window.addEventListener('resize', () => {
      if (document.getElementById('music-suggest').style.display !== 'none') dinhViGoiY();
    });
    // Enter trên bàn phím = submit form searchbar -> tìm (chặn tải lại trang).
    document.getElementById('music-searchbar').addEventListener('submit', (e) => { e.preventDefault(); timBai(); });
    document.getElementById('music-repeat-btn').addEventListener('click', (e) => { e.preventDefault(); doiCheDoLap(); });
    apDungCheDoLap();     // vẽ chế độ lặp đã nhớ của máy này (nút desktop + trình phát mở rộng)
    document.getElementById('music-player-tim').addEventListener('click', (e) => {
      e.preventDefault();
      if (baiKhungPhat) doiYeuThich(baiKhungPhat);
    });
    document.getElementById('music-output-btn').addEventListener('click', (e) => {
      e.preventDefault();
      rungNhe();
      moChonNoiPhat(e.currentTarget);
    });
    chonCheDoPhat(cheDoPhat, false);
    // Segmented Kết quả tìm | Yêu thích - tự xử lý (không dùng bindSegmented()
    // của settings-common.js vì hàm đó còn tô màu nút Lưu của trang cài đặt
    // đang mở ở tab khác).
    document.querySelectorAll('#music-tab .music-chip').forEach((b) => {
      b.addEventListener('click', () => {
        rungNhe();
        if (b.dataset.value === 'dang_phat' && tabDangXem !== 'dang_phat') dpHieuUng = true;
        chonTab(b.dataset.value);
        if (b.dataset.value === 'kham_pha') taiKhamPha();
      });
    });
    // Tab Đang phát (desktop): lăn chuột chỉ cuộn khi con trỏ nằm trên danh sách
    // (cột phải) - đặt chuột lên ảnh bìa/cột trái thì trang đứng yên.
    document.getElementById('music-results').addEventListener('wheel', (e) => {
      if (tabDangXem !== 'dang_phat' || !document.documentElement.classList.contains('device-desktop')) return;
      if (!e.target.closest('.mdp-phai')) e.preventDefault();
    }, { passive: false });
    document.getElementById('music-pl-menu').addEventListener('click', (e) => { e.preventDefault(); moMenuPlaylist(e.currentTarget); });
    document.getElementById('music-pl-quay-lai').addEventListener('click', (e) => { e.preventDefault(); rungNhe(); chonTab('yeu_thich'); });
    taiDanhSachDaLuu();
    $f7.on('daDangNhap', taiDanhSachDaLuu);
    document.getElementById('music-playpause-btn').addEventListener('click', (e) => { e.preventDefault(); togglePlayPause(); });
    // Phím Space = Phát/Tạm dừng khi đang đứng ở tab Nhạc và có bài (khung phát
    // đang hiện) - bỏ qua lúc đang gõ trong ô nhập (ô tìm kiếm...).
    document.addEventListener('keydown', (e) => {
      if (e.code !== 'Space' || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
      const t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      if (!document.getElementById('view-music')?.classList.contains('tab-active')) return;
      if (document.getElementById('music-player').style.display === 'none') return;
      e.preventDefault();
      togglePlayPause();
    });
    document.getElementById('music-shuffle-btn').addEventListener('click', (e) => { e.preventDefault(); doiTron(); });
    document.getElementById('music-kp-lam-moi').addEventListener('click', (e) => { e.preventDefault(); rungNhe(); taiKhamPha(true); });
    // Quay lại app/tab trình duyệt sau một lúc -> tải lại các hàng đã cũ (quá 10 phút).
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && tabDangXem === 'kham_pha') taiKhamPha();
    });
    document.getElementById('music-player-them').addEventListener('click', (e) => {
      e.preventDefault();
      if (baiKhungPhat) moMenuBai(baiKhungPhat, e.currentTarget, true);
    });
    document.getElementById('music-back-btn').addEventListener('click', (e) => { e.preventDefault(); skipMusic('/api/music/back'); });
    document.getElementById('music-next-btn').addEventListener('click', (e) => { e.preventDefault(); skipMusic('/api/music/next'); });
    // Icon loa ở hàng nút -> mở popover âm lượng. Range tạo lúc popover còn ẩn
    // (kích thước 0) nên phải tính lại kích thước mỗi lần popover mở xong.
    musicVolumePopover = $f7.popover.create({
      el: '#music-volume-popover',
      targetEl: '#music-mute-btn',
      on: {
        opened() {
          if (!musicVolumeRange) return;
          musicVolumeRange.calcSize();
          if (typeof musicVolumeRange.layout === 'function') musicVolumeRange.layout();
          else musicVolumeRange.setValue(musicVolumeRange.value);   // vẽ lại knob theo kích thước mới
        },
      },
    });
    document.getElementById('music-mute-btn').addEventListener('click', (e) => {
      e.preventDefault();
      rungNhe();
      musicVolumePopover.open('#music-mute-btn');
    });
    document.getElementById('music-volume-mute-btn').addEventListener('click', (e) => { e.preventDefault(); toggleMuteNhac(); });
    document.getElementById('music-volume-down-btn').addEventListener('click', (e) => { e.preventDefault(); chinhNhanhAmLuong(-10); });
    document.getElementById('music-volume-up-btn').addEventListener('click', (e) => { e.preventDefault(); chinhNhanhAmLuong(10); });

    // Kéo thanh tiến trình để tua: chặn tick/đồng bộ tự đổi giá trị trong lúc
    // đang kéo (musicSeeking), chỉ thật sự gọi API tua lúc THẢ tay ra - gọi liên
    // tục trong lúc kéo sẽ tua/khởi động lại luồng phát rất nhiều lần rất tốn.
    document.getElementById('music-progressbar').addEventListener('pointerdown', () => {
      musicSeeking = true;
    });
    document.addEventListener('pointerup', () => {
      if (!musicSeeking) return;
      musicSeeking = false;
      if (musicProgressRange) seekMusic(musicProgressRange.value);
    });

    // Chặn đồng bộ SSE đè giá trị thanh âm lượng giữa lúc đang tự kéo tay -
    // cùng lý do/cách làm với thanh tua nhạc ngay trên.
    document.getElementById('music-volume-range').addEventListener('pointerdown', () => {
      dangKeoMusicVolume = true;
    });
    document.addEventListener('pointerup', () => {
      dangKeoMusicVolume = false;
    });

    loadMusicStatus();
    $f7.on('daDangNhap', loadMusicStatus);
    moKetNoiMusicStatusSSE();
    $f7.on('daDangNhap', moKetNoiMusicStatusSSE);
    // Đồng bộ thật với server qua SSE (sửa lệch, bắt bài mới/trạng thái mới
    // như đang bị TTS tạm dừng - xem moKetNoiMusicStatusSSE), và tự chạy số
    // giây mượt mỗi giây ở giữa 2 lần đồng bộ đó (tickMusicProgress, KHÔNG
    // qua mạng) - trang này chỉ pageInit() một lần lúc app khởi động (không
    // phải mỗi lần chuyển tab) nên EventSource + interval này chạy suốt
    // phiên làm việc, chi phí không đáng kể.
    clearInterval(musicTickTimer);
    musicTickTimer = setInterval(tickMusicProgress, 1000);
  });

  return $render;
};
</script>
