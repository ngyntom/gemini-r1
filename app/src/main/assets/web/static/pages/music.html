          <!-- Icon CAST (kiểu YouTube Music) - bảng chọn nơi phát: Thiết bị này / Loa

<script>
export default (props, { $f7, $on }) => {
  let musicTickTimer = null;
  let musicPlayPollTimer = null;

  let musicProgressRange = null;
  let musicProgressRangeMax = null;
  let musicSeeking = false;

  // Trạng thái đọc được từ server lúc đồng bộ gần nhất - giây "elapsed" chạy
  // mượt giữa 2 lần đồng bộ bằng cách tự cộng thêm thời gian trôi qua ở máy
  // khách (xem tickMusicProgress), thay vì chỉ nhảy số mỗi 3 giây (giật/khựng).
  let musicSyncElapsed = 0;
  let musicDangTai = false;      // Máy này: đã bấm phát, chưa có tiếng (xem trangThaiMay)
  let musicSyncTs = 0;
  let musicState = 'stopped';
  let musicDuration = null;
  let musicBuffered = null;   // giây ĐÃ TẢI (vạch nhạt trên thanh tua, kiểu YouTube) - null = không biết

  // m:ss, dùng cho cả elapsed lẫn duration.
  function fmtTime(s) {
    if (s == null || isNaN(s)) return '0:00';
    s = Math.max(0, Math.round(s));
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + String(sec).padStart(2, '0');
  }

  // Thanh tiến trình dùng component Range của F7 (kéo tua được, khác Progressbar
  // chỉ để xem) - tạo lại mỗi khi biết tổng thời lượng bài mới (max đổi), còn
  // lại chỉ setValue(). Bỏ qua khi đang bị người dùng kéo tay (musicSeeking) để
  // không giằng co giá trị với ngón tay đang kéo.
  function ensureMusicProgressRange(elapsed, duration) {
    const max = duration && duration > 0 ? Math.round(duration) : 1;
    const val = Math.min(max, Math.max(0, Math.round(elapsed || 0)));
    if (!musicProgressRange || musicProgressRangeMax !== max) {
      if (musicProgressRange) musicProgressRange.destroy();
      // destroy() của F7 CHỈ gỡ sự kiện, không tự xóa DOM con (range-bar/
      // range-knob-wrap) đã chèn vào lúc create() - đã gặp lỗi thật: mỗi lần
      // chuyển bài (thời lượng đổi -> max đổi) lại sinh thêm 1 nút kéo chồng
      // lên nút cũ. Phải dọn sạch DOM tay trước khi tạo mới.
      const el = document.getElementById('music-progressbar');
      if (el) el.innerHTML = '';
      musicProgressRangeMax = max;
      musicProgressRange = $f7.range.create({
        el: '#music-progressbar',
        value: val,
        min: 0,
        max: max,
        step: 1,
        on: {
          change(range, v) {
            document.getElementById('music-elapsed').textContent = fmtTime(v);
            // change() bắn cả lúc TỰ đồng bộ tiến trình phát (setValue() mỗi
            // giây, xem updateProgressUI()) - chỉ rung lúc THẬT SỰ đang kéo
            // tay (musicSeeking), không rung liên tục suốt lúc phát nhạc.
            if (musicSeeking) rungNhe();
          },
        },
      });
      theoDoiCoGianThanhTua();
      return;
    }
    if (!musicSeeking) {
      musicProgressRange.setValue(val);
    }
  }

  // F7 Range tính vị trí nút kéo theo độ rộng thanh đo LÚC TẠO (calcSize) -
  // đổi thiết bị/tên bài làm chữ bên cạnh dài-ngắn, thanh co giãn mà F7 không
  // đo lại -> chấm tròn lệch khỏi phần đã chạy (đã gặp: 0:26/4:56 phần chạy
  // ~9%, chấm ở ~13%). Thanh đổi độ rộng là đo lại + đặt lại nút.
  let quanSatThanhTua = null;
  function theoDoiCoGianThanhTua() {
    const el = document.getElementById('music-progressbar');
    if (quanSatThanhTua || !el || !window.ResizeObserver) return;
    quanSatThanhTua = new ResizeObserver(() => {
      if (musicProgressRange && el.offsetWidth) { musicProgressRange.calcSize(); musicProgressRange.layout(); }
    });
    quanSatThanhTua.observe(el);
  }

  // Giây hiển thị NGAY LÚC NÀY, suy ra từ lần đồng bộ server gần nhất + thời
  // gian đã trôi qua ở máy khách kể từ lúc đó (chỉ cộng dồn khi đang thật sự
  // phát - đang tạm dừng thì đứng yên).
  function displayedElapsed() {
    if (musicState !== 'playing' || musicDangTai) return musicSyncElapsed;
    return musicSyncElapsed + (Date.now() - musicSyncTs) / 1000;
  }

  function updateProgressUI() {
    if (musicSeeking) return;
    const elapsed = displayedElapsed();
    ensureMusicProgressRange(elapsed, musicDuration);
    veDaTai();
    document.getElementById('music-elapsed').textContent = fmtTime(elapsed);
    document.getElementById('music-duration').textContent = musicDuration ? fmtTime(musicDuration) : '--:--';
  }

  // Vạch nhạt "đã tải" nằm dưới phần đã phát, trong .range-bar của F7 (tạo
  // lại mỗi lần F7 dựng lại range - xem ensureMusicProgressRange).
  function veDaTai() {
    const bar = document.querySelector('#music-progressbar .range-bar');
    if (!bar) return;
    let tai = bar.querySelector('.range-bar-tai');
    if (!tai) {
      tai = document.createElement('span');
      tai.className = 'range-bar-tai';
      bar.insertBefore(tai, bar.firstChild);
    }
    const pt = musicBuffered != null && musicDuration > 0 ? Math.min(100, (musicBuffered / musicDuration) * 100) : 0;
    tai.style.width = pt + '%';
  }

  // Chạy mỗi giây giữa 2 lần gọi API (loadMusicStatus) để số giây chạy mượt,
  // không cần chờ đồng bộ server mới thấy số đổi.
  function tickMusicProgress() {
    if (musicState !== 'playing') return;
    updateProgressUI();
  }

  function updatePlayPauseIcon(state) {
    const ic = document.getElementById('music-playpause-icon');
    ic.textContent = state === 'playing' ? 'pause_fill' : 'play_fill';
    ic.classList.toggle('icon-play-bu', state !== 'playing');
  }

  // ---------- Thanh âm lượng ở header "Đang phát" - âm lượng PHẦN CỨNG của
  // Pi (dùng chung API /api/music/volume với thanh ở trang Mic & loa >
  // "Loa"). "/api/music/status" đã có sẵn field "volume" (xem music_status()
  // trong webui.py) - KHÔNG cần tự gọi API riêng để tải giá trị ban đầu,
  // apDungTrangThaiNhac() bên dưới tự gọi ensureMusicHeaderVolumeRange() mỗi
  // lần có trạng thái mới (kể cả qua SSE) - tự động bắt được cả lúc âm lượng
  // bị đổi từ nơi khác (trang Mic & loa, chỉnh thẳng phần cứng...). Debounce
  // 250ms tránh gọi API dồn dập lúc đang kéo, và CHẶN đồng bộ SSE đè giá trị
  // giữa lúc đang tự kéo tay (dangKeoMusicVolume, cùng kiểu với musicSeeking
  // của thanh tua nhạc phía dưới). ----------
  let musicVolumeRange = null;
  let musicVolumePopover = null;
  let musicVolumeDebounce = null;
  let dangKeoMusicVolume = false;
  // Nhớ mức âm lượng NGAY TRƯỚC lúc bấm tắt tiếng - bấm lại nút mute lần nữa
  // thì khôi phục đúng mức cũ, thay vì luôn nhảy về 1 số cố định.
  let amLuongTruocMute = null;

  // Icon loa ở hàng nút đổi theo MỨC âm lượng (0 / thấp / vừa / to), kèm số %
  // và nút tắt/bật tiếng trong popover.
  function capNhatIconMute(value) {
    const v = Math.round(value || 0);
    const icon = document.getElementById('music-mute-icon');
    if (icon) {
      icon.textContent = v <= 0 ? 'speaker_slash_fill' : v < 34 ? 'speaker_1_fill' : v < 67 ? 'speaker_2_fill' : 'speaker_3_fill';
    }
    const so = document.getElementById('music-volume-label');
    if (so) so.textContent = v + '%';
    const nutMute = document.getElementById('music-volume-mute-icon');
    if (nutMute) nutMute.textContent = v > 0 ? 'speaker_slash_fill' : 'speaker_2_fill';
  }

  function ensureMusicHeaderVolumeRange(value) {
    capNhatIconMute(value);
    if (dangKeoMusicVolume) return;
    if (musicVolumeRange) {
      musicVolumeRange.setValue(value);
      return;
    }
    musicVolumeRange = $f7.range.create({
      el: '#music-volume-range',
      value: value,
      min: 0,
      max: 100,
      step: 1,
      vertical: true,              // thanh DỌC trong popover - dưới nhỏ, trên to
      label: false,                // số % hiện riêng phía trên (#music-volume-label)
      // CHỈ nhận thao tác lúc chạm đúng nút tròn kéo - xem giải thích đầy đủ
      // trong settings-common.js.
      draggableBar: false,
      formatLabel: (val) => Math.round(val) + '%',
      on: {
        change(range, val) {
          capNhatIconMute(val);
          rungNhe();
          clearTimeout(musicVolumeDebounce);
          musicVolumeDebounce = setTimeout(() => setMusicVolume(val), 250);
        },
      },
    });
  }

  async function setMusicVolume(level) {
    try {
      await api('/api/music/volume', { method: 'POST', body: JSON.stringify({ level }) });
    } catch (e) {
      baoLoi(e, 'Lỗi chỉnh âm lượng: ');
    }
  }

  // Nút tắt tiếng (mute) cạnh thanh âm lượng - đang có tiếng thì nhớ lại mức
  // hiện tại rồi đặt về 0, đang tắt (0) thì khôi phục đúng mức đã nhớ (hoặc
  // 50% nếu chưa từng nhớ, vd vừa mở app đã tắt tiếng luôn từ trước).
  function toggleMuteNhac() {
    const hienTai = musicVolumeRange ? musicVolumeRange.value : 0;
    rungNhe();
    const gtMoi = hienTai > 0 ? 0 : (amLuongTruocMute || 50);

  // 2 icon loa cạnh thanh trượt (nhỏ = giảm, to = tăng) - bấm 1 cái chỉnh

  // ---------- "Phát trên: Máy này" - trình duyệt/iPhone tự phát qua phần tử

  // RIÊNG của máy này. Lúc đang có bài trên máy thì mọi nút điều khiển (phát/

  let cheDoPhat = 'may';
  const loaMay = new Audio();
  loaMay.preload = 'auto';
  // AirPlay/Bluetooth của iOS (Safari, web app, app): phần tử phải cho phép

  else if (CO_CAST_TRINH_DUYET) loaMay.remote.watchAvailability(datCoThietBiGan).catch(() => {});
  if (loaMay.remote) { loaMay.remote.onconnect = () => capNhatTuMay(); loaMay.remote.ondisconnect = () => capNhatTuMay(); }
  let hangChoMay = [];
  let hangChoGoiY = true;      // hết hàng chờ thì tự nối bài liên quan (xem 'ended')
  let tenHangChoMay = '';      // "Đang phát từ ..." (tab Đang phát)

  let lanCapNhatMay = 0;

  // Chế độ lặp: Máy này = theo TÀI KHOẢN (luuCaiDatTk, lưu trên Pi; 2 máy vẫn nghe

  // .music_repeat.json), SSE đẩy về khi máy khác đổi. Nút lặp hiện/đổi đúng
  // chế độ của nơi phát đang chọn (lapHienTai).

  const TEN_CHE_DO_LAP = { tat: 'Lặp lại: tắt', tat_ca: 'Lặp lại toàn danh sách', mot: 'Lặp lại 1 bài' };

  // Đăng nhập máy khác/tài khoản khác: lấy chế độ lặp "Máy này" của tài khoản từ Pi.
  $f7.on('caiDatTk', (doi) => {

  });
  let lapPi = 'tat';
  // Vừa bấm đổi lặp của Loa Pi: SSE (vòng 2s) có thể còn đẩy về giá trị CŨ của
  // lần bấm trước -> ghi đè lựa chọn mới (đã gặp khi bấm nhanh). Bỏ qua lúc đó.
  let lapDoiLuc = 0;

  // Trộn bài (nút thanh phát kiểu Tidal): xáo các bài SẮP phát, bài đang nghe

  let tronMay = false;
  let hangChoGocMay = null;
  let tronPi = false;

  function tronHienTai() { return cheDoPhat === 'may' ? tronMay : tronPi; }

  async function doiTron() {

      const hienTai = hangChoMay[viTriMay];

  function lapHienTai() { return cheDoPhat === 'may' ? lapMay : lapPi; }

  // Trạng thái Loa Pi gần nhất (SSE/API) - để chuyển tiếp sang "Máy này".
  let trangThaiPiCuoi = null;
  // Mã MÁY này (mỗi điện thoại / app / web app 1 mã, lưu trên máy). Gửi kèm khi
  // phát ra Loa Pi/thiết bị khác; trạng thái Pi do MÁY KHÁC phát thì coi như
  // không có gì - 2 điện thoại dùng độc lập, không hiện/điều khiển bài của
  // nhau. Nhạc bật bằng giọng nói (không chủ) vẫn hiện ở mọi máy.
  const MAY_ID = (() => {
    let id = '';
    try { id = localStorage.getItem('voicebot_may_id') || ''; } catch (e) { /* riêng tư */ }
    if (!id) {
      id = 'm' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  function locTrangThaiPi(d) {

    }

  let noiPhatTen = 'Loa Pi';     // nơi Pi đang phát ra: "Loa Pi" hoặc tên thiết bị cast (Mi Box...)
  let noiPhatEntity = '';
  let dangChuyenSangPi = null;
  let giuChoMini = false;   // {id,title,duration,elapsed,han} lúc đang chuyển Máy này -> Pi
  let piDongBoLuc = 0;
  // Pi tự giành nơi phát (xem nhoTrangThaiPi) - Pi dừng hẳn thì trả về Máy này.
  let piTuGianh = false;

  function nhoTrangThaiPi(data) {
    const truoc = trangThaiPiCuoi;
    noiPhatTen = data.noi_phat || 'Loa Pi';
    nhanTronTuPi(data.tron);
    trangThaiPiCuoi = data;
    piDongBoLuc = Date.now();
    // Pi vừa BẮT ĐẦU phát bài mới mà KHÔNG do máy này chuyển sang (vd ra lệnh
    // bằng giọng nói "phát nhạc yêu thích"): trước đây máy này còn giữ bài
    // "Máy này" (đang phát/tạm dừng) nên bỏ qua hẳn trạng thái Pi - khung phát
    // không đổi, nút bấm vẫn điều khiển bài trên máy, không điều khiển được

    const piVuaPhat = data.state === 'playing' && !!data.title &&
      !(truoc && truoc.state === 'playing' && truoc.title === data.title);
    // Máy này ĐANG phát (có tiếng) thì giữ nguyên - người khác/điện thoại khác
    // gửi nhạc ra Loa Pi không được cắt ngang người đang nghe riêng.
    const mayDangNghe = dangPhatTrenMay() && !loaMay.paused;
    if (piVuaPhat && cheDoPhat === 'may' && !dangChuyenSangPi && !mayDangNghe) {
      if (dangPhatTrenMay()) dungTrenMay();

      piTuGianh = true;
    } else if (piTuGianh && data.state === 'stopped') {
      piTuGianh = false;
      if (cheDoPhat === 'pi' && !dangPhatTrenMay()) chonCheDoPhat('may');

  function dangPhatTrenMay() {

  }

  // Trình duyệt tự tải trước: lấy đoạn đã tải chứa vị trí đang phát.
  function giayDaTaiMay() {
    const b = loaMay.buffered, t = loaMay.currentTime || 0;
    try {
      for (let i = 0; i < b.length; i++) {
        if (b.start(i) <= t + 0.5 && t <= b.end(i) + 0.5) return (dangMp3 ? mp3BuDau : 0) + b.end(i);
      }
    } catch (e) { /* chưa có dữ liệu */ }
    return null;
  }

  function trangThaiMay() {
    const bai = hangChoMay[viTriMay] || {};
    const coBai = dangPhatTrenMay();
    return {
      state: !coBai ? 'stopped' : (loaMay.paused ? 'paused' : 'playing'),
      // Đã bấm phát nhưng CHƯA có tiếng (Pi đang lấy link YouTube ~2-3s + tải
      // đoạn đầu): báo "Đang tải…" và đứng yên thời gian - trước đây vẫn báo

      dangTai: coBai && !loaMay.paused && loaMay.readyState < 3,
      title: bai.title || '',

      // Ưu tiên thời lượng YouTube: iPhone tự ĐOÁN độ dài file m4a phân mảnh
      // và có thể sai (đo thật: bài 5:59 báo 11:57 - metadata file vẫn đúng 358.6s).
      duration: bai.duration || (!dangMp3 && isFinite(loaMay.duration) && loaMay.duration > 0 ? loaMay.duration : null),
      buffered: giayDaTaiMay(),

      trenMay: true,
      tenMay: tenMayNay(),

  }

  // Vẽ lại khung phát + báo mini player (mini-player.js nghe "nhac-tren-may").
  function capNhatTuMay() {
    const st = trangThaiMay();
    apDungTrangThaiNhac(st);
    if (!dangChuyenSangPi) window.dispatchEvent(new CustomEvent('nhac-tren-may', { detail: st }));

  function capNhatMediaSession(bai) {
    if (!('mediaSession' in navigator) || !bai) return;

      navigator.mediaSession.metadata = new MediaMetadata({
        title: bai.title || '',
        artist: bai.channel || 'Voicebot',

  }

  // Bài RẤT DÀI (> 3 tiếng, vd nhạc piano 25 tiếng - file AAC 1.5GB): MP4 phân
  // mảnh của YouTube có bảng mục lục khổng lồ ở đầu, iPhone đọc thử mãi không
  // phát được (log thật: xin lại luồng mỗi 2s) -> Pi BÓC tiếng AAC ra khỏi vỏ
  // MP4 (/api/music/stream_aac - không mã hoá lại, giữ chất lượng). Bài thường

  // mới từ giây đó (?ss=), vị trí = mp3BuDau + currentTime.
  const BAI_RAT_DAI = 3 * 3600;
  let dangMp3 = false;
  let mp3BuDau = 0;
  let henMp3 = null;
  function giayMay() { return (dangMp3 ? mp3BuDau : 0) + (loaMay.currentTime || 0); }
  function choiMay() {
    loaMay.play().catch((e) => {

    });
  }
  function moLuongMp3(bai, tuGiay) {
    dangMp3 = true;
    mp3BuDau = Math.max(0, Math.floor(tuGiay || 0));

    choiMay();
  }

    if (dangMp3) { moLuongMp3(hangChoMay[viTriMay], giay); capNhatTuMay(); }
    else loaMay.currentTime = giay;
  }

  function phatBaiTrenMay(i, batDauTu) {
    if (i < 0 || i >= hangChoMay.length) {

      return false;
    }
    viTriMay = i;
    const bai = hangChoMay[i];
    clearTimeout(henMp3);
    taiTruoc([hangChoMay[i + 1], hangChoMay[i + 2]]);
    ghiLichSuMay(bai);
    if ((bai.duration || 0) > BAI_RAT_DAI) {
      moLuongMp3(bai, batDauTu);
    } else {
      dangMp3 = false;
      mp3BuDau = 0;
      loaMay.src = '/api/music/stream/' + encodeURIComponent(bai.id);
      if (batDauTu > 0) {
        // Chuyển tiếp từ Loa Pi giữa bài - tua tới đúng giây khi đã biết thời lượng.
        const tua = () => { loaMay.removeEventListener('loadedmetadata', tua); loaMay.currentTime = batDauTu; };
        loaMay.addEventListener('loadedmetadata', tua);
      }
      choiMay();
      henMp3 = setTimeout(() => {
        if (viTriMay === i && hangChoMay[i] === bai && !dangMp3 && !loaMay.paused && loaMay.readyState < 3) {
          console.warn('[nhạc] AAC 12s chưa phát được -> chuyển luồng MP3');
          moLuongMp3(bai, batDauTu || 0);
          capNhatTuMay();
        }
      }, 12000);
    }
    capNhatMediaSession(bai);
    capNhatTuMay();
    return true;
  }

  // ---------- Bảng chọn NƠI PHÁT kiểu YouTube Music (icon cast) ----------
  // Đầu: bài đang phát. Thiết bị này | Loa Pi | AirPlay và Bluetooth (bảng chọn
  // của iOS) / Cast từ trình duyệt (Chrome). Không lấy thiết bị từ Home Assistant.
  // Máy tính: popover cạnh nút; điện thoại: màn tối toàn trang.
  function moChonNoiPhat(nutGoc) {

      : $f7.popup.create({ swipeToClose: 'to-bottom', content: '<div class="popup music-menu-bai music-menu-bai-dt music-noi-phat"><div class="mmb-vung"></div><a href="#" class="mmb-huy" title="Đóng" aria-label="Đóng"><i class="icon f7-icons">xmark</i></a></div>', on: { closed: (m) => m.destroy() } });
    const vung = modal.el.querySelector('.mmb-vung');
    const daChon = (hd) => (hd === 'may' ? cheDoPhat === 'may'
      : cheDoPhat !== 'may' && (hd === 'pi' ? !noiPhatEntity : hd === 'ha:' + noiPhatEntity));
    // Thiết bị trong Home Assistant (Phicomm, Nest Hub, Mi Box...): Pi đẩy nhạc
    // thẳng tới loa - thấy giống nhau trên Chrome/app Mac/app iOS (AirPlay của
    // máy chỉ có ở iOS, Cast trình duyệt chỉ có ở Chrome). null = đang tải.
    let dsHa = null, loiHa = '';
    const TEN_TT_HA = { off: 'Đang tắt', playing: 'Đang phát', paused: 'Tạm dừng', standby: 'Chờ' };
    const iconHa = (t) => (t.loai === 'tv' || /tv|box|display/i.test(t.ten) ? 'tv' : 'hifispeaker');
    const muc = (hd, icon, ten, phu) => htmlMucMenu(hd, icon, ten,
      (phu ? '<em>' + esc(phu) + '</em>' : '') + (daChon(hd) ? '<i class="icon f7-icons mmb-con mmb-chon">checkmark_alt</i>' : ''));
    const ve = () => {
      const bai = baiKhungPhat;
      const ganDay = coThietBiGan === null ? '' : coThietBiGan ? 'Có thiết bị ở gần' : 'Không thấy thiết bị';
      vung.innerHTML =
        (bai ? '<div class="mmb-nhom">Đang phát</div><div class="mmb-dau"><span class="mmb-anh" style="background-image:url(\'https://i.ytimg.com/vi/' + encodeURIComponent(bai.id) + '/hqdefault.jpg\')"></span>' +
          '<div class="mmb-chu"><div class="mmb-ten">' + esc(bai.title) + '</div><div class="mmb-phu">' + esc(bai.channel || '') + '</div></div></div>' : '') +
        '<div class="mmb-ds">' + muc('may', 'device_phone_portrait', 'Thiết bị này') + muc('pi', 'hifispeaker_fill', 'Loa Pi') +
          // Có sẵn trong máy, không cần Pi/HA (dùng được cả khi đi nhà khác):
          (CO_AIRPLAY ? muc('airplay', 'antenna_radiowaves_left_right', 'AirPlay và Bluetooth', ganDay) : '') +
          (CO_CAST_TRINH_DUYET ? muc('cast_trinh_duyet', 'tv', 'Cast từ trình duyệt', ganDay) : '') + '</div>' +
        '<div class="mmb-nhom">Thiết bị trong nhà</div><div class="mmb-ds">' +
          (dsHa === null ? '<div class="mmb-phu mmb-ha-cho">Đang tìm thiết bị…</div>'
            : !dsHa.length ? '<div class="mmb-phu mmb-ha-cho">' + esc(loiHa || 'Không có thiết bị nào') + '</div>'
            : dsHa.map((t) => muc('ha:' + t.entity, iconHa(t), t.ten, TEN_TT_HA[t.state] || '')).join('')) + '</div>';
      if (rong && modal.opened) modal.resize();
    };
    ve();
    api('/api/music/thiet_bi').then((r) => {
      dsHa = r.ha || [];
      loiHa = r.loi ? 'Không lấy được thiết bị từ Home Assistant' : '';
      const np = r.noi_phat || {};
      noiPhatEntity = np.loai === 'ha' ? (np.entity || '') : '';
      ve();
    }).catch(() => { dsHa = []; loiHa = 'Không lấy được thiết bị từ Home Assistant'; ve(); });
    veLaiBangNoiPhat = ve;
    modal.on('close', () => { if (veLaiBangNoiPhat === ve) veLaiBangNoiPhat = null; });
    modal.el.addEventListener('click', (e) => {
      if (e.target.closest('.mmb-huy')) { e.preventDefault(); modal.close(); return; }
      const a = e.target.closest('[data-hd]');
      if (!a) return;
      e.preventDefault();
      const hd = a.dataset.hd;
      const ten = (a.querySelector('span') || {}).textContent || '';
      if (hd === 'airplay' || hd === 'cast_trinh_duyet') {
        // Bảng chọn của iOS/Chrome phải mở NGAY trong lúc chạm. Đang phát ở Pi/
        // thiết bị khác thì chuyển về máy này trước (vẫn trong lúc chạm).
        rungNhe();
        if (cheDoPhat !== 'may') chonCheDoPhat('may', true);
        modal.close();
        moBangChonCuaMay(hd);
        return;
      }
      modal.close();
      chonNoiPhat(hd, ten);        // chạy NGAY trong lúc chạm (iOS cần cho play() khi chọn Thiết bị này)
    });
    modal.open();
  }

  // AirPlay/Bluetooth (bảng chọn của iOS) hoặc Chromecast của Chrome - nhạc
  // vẫn phát từ MÁY NÀY (kéo từ Pi như thường), chỉ đổi đường ra loa.
  function moBangChonCuaMay(hd) {
    try {
      if (hd === 'airplay') { loaMay.webkitShowPlaybackTargetPicker(); return; }
      if (!loaMay.getAttribute('src')) { $f7.toast.show({ text: 'Hãy phát 1 bài trên máy này trước', closeTimeout: 2000 }); return; }
      loaMay.remote.prompt().catch((e) => {
        if (e && e.name !== 'AbortError') $f7.toast.show({ text: 'Không tìm thấy thiết bị cast nào', closeTimeout: 2000 });
      });
    } catch (e) { baoLoi(e); }
  }

  async function chonNoiPhat(hd, ten) {
    rungNhe();
    if (hd === 'may') { if (cheDoPhat !== 'may') chonCheDoPhat('may', true); return; }
    const body = hd === 'pi' ? { loai: 'pi' } : { loai: 'ha', entity: hd.slice(3), ten };
    const tenMoi = hd === 'pi' ? 'Loa Pi' : ten;
    // Đang phát ở Pi/thiết bị khác -> giữ khung phát ("Đang chuyển sang ...")
    // trong lúc Pi dừng nơi cũ + bắt đầu nơi mới, không chớp tắt.
    if (cheDoPhat !== 'may' && baiKhungPhat && musicState !== 'stopped') {
      dangChuyenSangPi = { id: baiKhungPhat.id, title: baiKhungPhat.title, duration: baiKhungPhat.duration,
        elapsed: displayedElapsed(), han: Date.now() + 25000, noi: tenMoi };
      danhDauBaiDangPhat();          // vòng xoay ở nút play ngay lúc bấm chọn
    }
    try {
      const r = await api('/api/music/noi_phat', { method: 'POST', body: JSON.stringify(body) });
      noiPhatEntity = (r.noi_phat || {}).entity || '';
      noiPhatTen = hd === 'pi' ? 'Loa Pi' : ten;
    } catch (e) { baoLoi(e); return; }
    if (cheDoPhat === 'may') chonCheDoPhat('pi', true);      // Máy này -> nơi mới: chuyển tiếp đúng bài, đúng giây
    else { chonCheDoPhat('pi', false); $f7.toast.show({ text: 'Phát trên: ' + noiPhatTen, closeTimeout: 1500 }); loadMusicStatus(); }
  }

  // Nhờ Pi lấy SẴN link YouTube (/api/music/prefetch) cho bài sắp phát - khỏi
  // chờ yt-dlp (~2s) lúc bấm. Cả Máy này lẫn Loa Pi (Pi dùng lại link đó).
  const daTaiTruoc = {};
  function taiTruoc(dsBai) {
    // Mỗi bài tối đa 1 lần / 20 phút (rê chuột qua lại không gửi dồn dập).
    const ids = dsBai.filter((b) => b && b.id && !(daTaiTruoc[b.id] > Date.now() - 20 * 60 * 1000)).map((b) => b.id);
    if (!ids.length) return;
    ids.forEach((id) => { daTaiTruoc[id] = Date.now(); });
    fetch('/api/music/prefetch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids }) }).catch(() => {});
  }

  // Máy tính: rê chuột lên thẻ/dòng ~150ms là lấy trước link (thường người dùng
  // rê tới rồi mới bấm, ~0.5-1s) - lúc bấm Pi đã có sẵn, phát gần như ngay.
  function ganTaiTruocKhiRe(el, bai) {
    let hen = null;
    el.addEventListener('mouseenter', () => { hen = setTimeout(() => taiTruoc([bai]), 150); });
    el.addEventListener('mouseleave', () => clearTimeout(hen));
  }

  function dungTrenMay() {
    clearTimeout(henMp3);
    dangMp3 = false;
    mp3BuDau = 0;
    loaMay.pause();
    loaMay.removeAttribute('src');
    loaMay.load();
    viTriMay = -1;
    if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
    capNhatTuMay();
  }

  function chuyenBaiTrenMay(tien) {
    if (tien) {
      if (viTriMay + 1 >= hangChoMay.length && lapMay === 'tat_ca') return phatBaiTrenMay(0);
      return phatBaiTrenMay(viTriMay + 1);
    }
    // "Bài trước": đã nghe > 3s thì về đầu bài (giống trình phát nhạc thường).
    if (giayMay() > 3 || viTriMay === 0) { tuaTrenMay(0); return true; }
    return phatBaiTrenMay(viTriMay - 1);
  }

  // Luồng bị đứt giữa chừng làm thẻ audio hỏng hẳn (bấm phát báo "The element
  // has no supported sources") -> mở lại đúng bài từ giây đang nghe. Tối đa 2
  // lần/bài để link hỏng thật không lặp mãi.
  let khoiPhucMay = { bai: null, lan: 0 };
  function thuKhoiPhucMay() {
    const bai = hangChoMay[viTriMay];
    if (!bai) return false;
    if (khoiPhucMay.bai !== bai) khoiPhucMay = { bai, lan: 0 };
    if (++khoiPhucMay.lan > 2) return false;
    const giay = giayMay();
    console.warn('[nhạc] Luồng hỏng -> mở lại bài từ giây', Math.round(giay));
    phatBaiTrenMay(viTriMay, giay);
    return true;
  }

  function batTatTrenMay() {
    if (loaMay.paused) {
      loaMay.play().catch((e) => {
        if (e && e.name === 'NotSupportedError' && thuKhoiPhucMay()) return;
        baoLoi(e, 'Không phát được: ');
      });
    } else loaMay.pause();
  }

  ['play', 'pause', 'loadedmetadata', 'waiting', 'playing', 'canplay', 'progress'].forEach((ten) => loaMay.addEventListener(ten, capNhatTuMay));
  loaMay.addEventListener('timeupdate', () => {
    // iPhone đoán sai độ dài (gấp đôi) -> hết tiếng ở đúng thời lượng thật
    // nhưng 'ended' không tới, đồng hồ chạy tiếp trong im lặng. Đã quá thời
    // lượng YouTube (làm tròn giây -> +1s cho chắc) thì tự coi là hết bài.
    const bai = hangChoMay[viTriMay];
    if (bai && bai.duration && !loaMay.paused && giayMay() >= bai.duration + 1 && daHetBaiMay !== bai) {
      daHetBaiMay = bai;
      hetBaiTrenMay();
      return;
    }
    if (Date.now() - lanCapNhatMay < 1000) return;   // ~1 lần/giây là đủ
    lanCapNhatMay = Date.now();
    capNhatTuMay();
  });
  // Hết bài: sang bài kế; hết hàng chờ (kể cả Yêu thích/danh sách tự tạo)
  // thì nối bài LIÊN QUAN rồi phát tiếp - kiểu
  // "radio" của Tidal (/api/music/related, YouTube Mix của bài cuối).
  let daHetBaiMay = null;    // bài đã xử lý "hết bài" (timeupdate hoặc 'ended') - không sang bài 2 lần
  loaMay.addEventListener('ended', () => {
    const bai = hangChoMay[viTriMay];
    if (bai && daHetBaiMay === bai) return;
    daHetBaiMay = bai || null;
    hetBaiTrenMay();
  });
  loaMay.addEventListener('playing', () => { if (giayMay() < 2) daHetBaiMay = null; });
  async function hetBaiTrenMay() {
    if (lapMay === 'mot') { daHetBaiMay = null; tuaTrenMay(0); loaMay.play().catch(() => {}); return; }
    if (viTriMay + 1 < hangChoMay.length) { phatBaiTrenMay(viTriMay + 1); return; }
    if (lapMay === 'tat_ca' && hangChoMay.length) { phatBaiTrenMay(0); return; }
    const cuoi = hangChoMay[hangChoMay.length - 1];
    if (!hangChoGoiY || !cuoi) { dungTrenMay(); return; }
    try {
      const bo = hangChoMay.map((b) => b.id).join(',');
      const data = await api('/api/music/related?id=' + encodeURIComponent(cuoi.id) + '&bo_qua=' + encodeURIComponent(bo));
      const them = data.results || [];
      if (!them.length) { dungTrenMay(); return; }
      hangChoMay = hangChoMay.concat(them);
      phatBaiTrenMay(viTriMay + 1);
    } catch (e) {
      dungTrenMay();
    }
  }
  loaMay.addEventListener('error', () => {
    if (!dangPhatTrenMay()) return;
    if (loaMay.currentTime > 0 && thuKhoiPhucMay()) return;    // đứt giữa bài
    datBaiDangMo(null);
    baoLoi(new Error('Pi không lấy được luồng bài này'), 'Lỗi phát trên máy: ');
  });
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession;
    const dat = (ten, fn) => { try { ms.setActionHandler(ten, fn); } catch (e) { /* không hỗ trợ */ } };
    dat('play', () => loaMay.play());
    dat('pause', () => loaMay.pause());
    dat('nexttrack', () => chuyenBaiTrenMay(true));
    dat('previoustrack', () => chuyenBaiTrenMay(false));
    dat('seekto', (d) => { if (d && d.seekTime != null) tuaTrenMay(d.seekTime); });
  }
  // Lệnh từ mini player / trình phát mở rộng (mini-player.js) - dùng ĐÚNG
  // các hàm của trang này nên tự biết đang phát trên Loa Pi hay Máy này.
  window.addEventListener('nhac-lenh', (e) => {
    const d = e.detail || {};
    if (d.lenh === 'playpause') togglePlayPause();
    else if (d.lenh === 'next') skipMusic('/api/music/next');
    else if (d.lenh === 'back') skipMusic('/api/music/back');
    else if (d.lenh === 'stop') stopMusic();
    else if (d.lenh === 'seek') seekMusic(d.giay);
    else if (d.lenh === 'noi-phat') moChonNoiPhat(null);
    else if (d.lenh === 'tim' && baiKhungPhat) doiYeuThich(baiKhungPhat);
    else if (d.lenh === 'lap') doiCheDoLap();
    else if (d.lenh === 'tron') doiTron();
    else if (d.lenh === 'chia-se' && baiKhungPhat) chiaSeBai(baiKhungPhat);
    else if (d.lenh === 'menu' && baiKhungPhat) moMenuBai(baiKhungPhat, d.nut, true);
  });

  function chonCheDoPhat(cheDo, luu) {
    cheDoPhat = cheDo;
    if (luu) piTuGianh = false;
    const nut = document.getElementById('music-output-btn');
    nut.title = 'Đang phát trên: ' + (cheDo === 'may' ? 'Máy này' : noiPhatTen) + ' - chạm để chọn thiết bị';
    // Phát ở NƠI KHÁC (Loa Pi / thiết bị cast) = icon cast màu chủ đề, như YouTube Music.
    nut.classList.toggle('dang-cast', cheDo !== 'may');
    apDungCheDoLap();
    apDungTron();
    if (luu) {
      $f7.toast.show({ text: 'Phát trên: ' + (cheDo === 'may' ? 'Máy này' : noiPhatTen), closeTimeout: 1500 });
    }
    if (luu) chuyenTiepKhiDoiNoiPhat(cheDo);
  }

  // Đang phát mà đổi nơi phát -> CHUYỂN TIẾP đúng bài, đúng giây (không phải
  // dừng hẳn rồi chọn lại bài). iOS chỉ cho phát âm thanh khi play() chạy
  // NGAY trong lúc chạm -> Loa Pi -> Máy này phải bắt đầu phát trên máy TRƯỚC
  // (dùng id bài + vị trí đã biết từ trạng thái Pi gần nhất), lấy hàng chờ
  // đầy đủ + dừng loa Pi sau, ở nền.
  function chuyenTiepKhiDoiNoiPhat(cheDo) {
    if (cheDo === 'may') {
      const pi = trangThaiPiCuoi;
      if (dangPhatTrenMay() || !pi || pi.state === 'stopped' || !pi.id) return;
      const viTri = pi.state === 'playing' ? pi.elapsed + (Date.now() - piDongBoLuc) / 1000 : pi.elapsed;
      hangChoMay = [{ id: pi.id, title: pi.title, duration: pi.duration }];
      phatBaiTrenMay(0, viTri || 0);
      if (pi.state === 'paused') loaMay.pause();
      (async () => {
        try {
          const q = await api('/api/music/queue');
          const ds = Array.isArray(q.entries) ? q.entries : [];
          const i = Number(q.index);
          if (ds[i] && ds[i].id === pi.id) {      // ghép cả hàng chờ của Pi để Trước/Tiếp đi tiếp
            hangChoMay = ds;
            viTriMay = i;
            tenHangChoMay = q.query || '';
          }
          hangChoGoiY = q.goi_y !== false;
          await api('/api/music/stop', { method: 'POST' });
        } catch (e) {
          baoLoi(e, 'Lỗi chuyển sang máy này: ');
        }
      })();
      return;
    }
    // Máy này -> Loa Pi: gửi hàng chờ + vị trí hiện tại cho Pi phát tiếp,
    // không đọc lại câu "Đang phát..." (thong_bao: false).
    if (!dangPhatTrenMay()) return;
    const ds = hangChoMay.slice();
    const i = viTriMay;
    const viTri = giayMay();
    const dangTamDung = loaMay.paused;
    // Giữ khung phát trong lúc Pi lấy bài (~3-5s) - không thì vừa dừng trên
    // máy là khung ẩn đi rồi mới hiện lại khi Pi phát (đã gặp).
    if (!dangTamDung && ds[i]) {
      dangChuyenSangPi = { id: ds[i].id, title: ds[i].title, duration: ds[i].duration, elapsed: viTri, han: Date.now() + 25000, noi: noiPhatTen };
    }
    dungTrenMay();
    if (dangTamDung) return;               // đang tạm dừng trên máy thì chỉ dừng hẳn
    $f7.toast.show({ text: 'Đang chuyển sang ' + noiPhatTen + '...', closeTimeout: 2000 });
    api('/api/music/play_item', {
      method: 'POST',
      body: JSON.stringify({ query: tenHangChoMay || 'Máy này', index: i, entries: ds, bat_dau_tu: viTri, thong_bao: false, goi_y: hangChoGoiY, may_id: MAY_ID }),
    }).then(() => setTimeout(loadMusicStatus, 4000)).catch((e) => baoLoi(e, 'Lỗi chuyển sang Loa Pi: '));
  }

  // ---------- Khung phát (#music-player): ẨN khi không có nhạc; tên bài, ảnh
  // bìa, dòng phụ (kênh / nơi phát + trạng thái), tim yêu thích bài đang phát.
  let khungPhatDangHien = false;
  let baiKhungPhat = null;       // {id,title,duration,channel} bài đang hiện

  function timBaiTheoId(id) {
    if (!id) return null;
    return [hangChoMay, ketQuaTim, dsYeuThich].flat().find((b) => b && b.id === id) || null;
  }

  function capNhatTimKhungPhat() {
    const nut = document.getElementById('music-player-tim');
    const co = !!(baiKhungPhat && baiKhungPhat.id && laYeuThich(baiKhungPhat.id));
    nut.style.visibility = baiKhungPhat && baiKhungPhat.id ? '' : 'hidden';
    document.getElementById('music-player-tim-icon').textContent = co ? 'heart_fill' : 'heart';
    window.dispatchEvent(new CustomEvent('nhac-tim', {
      detail: { co, coBai: !!(baiKhungPhat && baiKhungPhat.id), kenh: (baiKhungPhat && baiKhungPhat.channel) || '' },
    }));
    nut.style.color = co ? 'var(--f7-color-red)' : 'var(--f7-text-color)';
  }

  function capNhatKhungPhat(data, nhan) {
    const hien = data.state && data.state !== 'stopped';
    const el = document.getElementById('music-player');
    el.style.display = hien ? '' : 'none';
    // Desktop: khung là thanh CỐ ĐỊNH đáy - chừa chỗ cuối trang (app.css).
    document.querySelector('.page-content.music-vua-man-hinh').classList.toggle('co-khung-phat', hien);
    if (!hien) { khungPhatDangHien = false; baiKhungPhat = null; return; }

    // Âm lượng popover là loa PI - chỉ hiện khi nhạc ĐANG phát ở loa Pi (kể
    // cả bật bằng giọng nói lúc đang chọn "Máy này"); phát trên máy thì chỉnh
    // bằng phím cứng.
    document.getElementById('music-mute-btn').style.display = data.trenMay ? 'none' : '';
    const bai = timBaiTheoId(data.id) || {};
    baiKhungPhat = data.id ? { id: data.id, title: data.title, duration: data.duration, channel: bai.channel || '' } : null;
    document.getElementById('music-now-playing').textContent = data.title || '';
    document.getElementById('music-player-phu').textContent =
      [nhan.replace(/:\s*$/, ''), data.dangChuyen ? '' : (data.trenMay ? (data.tenMay || 'Máy này') : (data.noi_phat || 'Loa Pi')), bai.channel]
        .filter(Boolean).join(' · ');
    const img = document.getElementById('music-player-anh');
    const src = data.id ? 'https://i.ytimg.com/vi/' + encodeURIComponent(data.id) + '/mqdefault.jpg' : '';
    if (img.dataset.src !== src) {
      img.dataset.src = src;
      img.style.display = 'none';
      if (src) {
        img.onload = () => { img.style.display = ''; };
        img.src = src;
      }
    }
    capNhatTimKhungPhat();
    // Range tạo lúc khung còn ẩn (kích thước 0) -> vừa hiện thì tính lại.
    if (!khungPhatDangHien) {
      khungPhatDangHien = true;
      requestAnimationFrame(() => {
        if (musicProgressRange) { musicProgressRange.calcSize(); musicProgressRange.setValue(musicProgressRange.value); }
      });
    }
  }

  function apDungTrangThaiNhac(data) {
    // Đang chuyển "Máy này" -> Loa Pi: Pi còn "stopped" vài giây lúc lấy bài -
    // hiện tạm đúng bài đó thay vì ẩn khung. Pi phát rồi (hoặc quá hạn) thì bỏ.
    // Đổi thiết bị (Loa Pi <-> Mi Box...) cũng vậy: chỉ bỏ khi NƠI MỚI đã phát
    // (thiết bị cũ còn báo "đang phát" vài giây không tính) - trước đây khung
    // phát biến mất lúc đổi, phải bấm phát lại (phản ánh thật).
    if (dangChuyenSangPi) {
      const daToiNoiMoi = !dangChuyenSangPi.noi || (data.noi_phat || 'Loa Pi') === dangChuyenSangPi.noi;
      if (data.state !== 'stopped' && !data.trenMay && daToiNoiMoi && !data.dangTai) dangChuyenSangPi = null;
      else if (Date.now() > dangChuyenSangPi.han) dangChuyenSangPi = null;
      else if (data.state === 'stopped' || !daToiNoiMoi) {
        data = Object.assign({}, dangChuyenSangPi, { state: 'paused', dangChuyen: true });
      }
    }
    // Mini player (điện thoại) cũng giữ bài đó trong lúc chuyển, không chớp tắt.
    if (data.dangChuyen) {
      giuChoMini = true;
      window.dispatchEvent(new CustomEvent('nhac-tren-may', { detail: data }));
    } else if (giuChoMini) {
      giuChoMini = false;
      window.dispatchEvent(new CustomEvent('nhac-tren-may', { detail: { state: 'stopped' } }));
    }
    const nhan = data.dangChuyen ? 'Đang chuyển sang ' + (data.noi || 'Loa Pi') + ': '
      : data.dangTai ? 'Đang tải: '
      : ({ playing: 'Đang phát: ', paused: 'Đã tạm dừng: ', stopped: '' }[data.state] || '');
    capNhatKhungPhat(data, nhan);
    musicSyncElapsed = data.elapsed || 0;
    musicSyncTs = Date.now();
    musicState = data.state;
    musicDangTai = !!data.dangTai;
    musicDuration = data.duration;
    musicBuffered = typeof data.buffered === 'number' ? data.buffered : null;
    updateProgressUI();
    updatePlayPauseIcon(data.state);
    if (typeof data.volume === 'number') ensureMusicHeaderVolumeRange(data.volume);
    if (baiDangMo && data.id === baiDangMo.id && data.state === 'playing' && !data.dangTai) baiDangMo = null;
    const doiBai = (data.title || '') !== tenBaiDangPhat;
    tenBaiDangPhat = data.state === 'stopped' ? '' : (data.title || '');
    danhDauBaiDangPhat();
    hienChipDangPhat(data.state !== 'stopped' || !!data.dangChuyen);
    if (tabDangXem === 'dang_phat' && doiBai && data.state !== 'stopped') capNhatDangPhatTaiCho(data);
    capNhatChatLuong(data);
    if (doiBai && data.id && !data.trenMay && data.state === 'playing') {
      capNhatGanDay({ id: data.id, title: data.title, duration: data.duration, channel: (baiKhungPhat || {}).channel || '' });
    }
  }

  // Gọi TAY - dùng ngay sau khi CHÍNH tab này vừa thao tác (tua/phát/dừng...)
  // để có phản hồi tức thì, không chờ SSE (moKetNoiMusicStatusSSE bên dưới)
  // tới lượt kiểm tra kế tiếp (tối đa 2 giây).
  async function loadMusicStatus() {
    try {
      const data = locTrangThaiPi(await api('/api/music/status'));
      nhoTrangThaiPi(data);
      nhanCheDoLapTuPi(data.lap);
      if (dangPhatTrenMay()) { capNhatTuMay(); return; }
      apDungTrangThaiNhac(data);
    } catch (e) {
      // Chỉ hiện lỗi khi ĐANG đứng ở tab Nhạc VÀ lần đồng bộ gần nhất còn biết
      // nhạc đang phát (musicState) - đúng yêu cầu thực tế "báo lỗi nếu đang
      // chơi nhạc mà bị lỗi", không phải mọi lỗi mọi lúc (đã gặp lỗi thật:
      // hiện toast đỏ dù đang đứng ở tab khác không hề xem tab Nhạc).
      const dangOTabNhac = document.getElementById('view-music')?.classList.contains('tab-active');
      if (dangOTabNhac && musicState === 'playing') {
        baoLoi(e, 'Lỗi tải trạng thái nhạc: ');
      }
    }
  }

  // SSE (Server-Sent Events) thay cho polling gọi lại API mỗi 3 giây trước
  // đây - server tự đẩy trạng thái MỚI ngay khi có gì đổi (xem
  // /api/music/status/stream trong webui.py, server tự so sánh + chỉ đẩy khi
  // đổi thật). Trang này chỉ pageInit() 1 lần lúc app khởi động (không phải
  // mỗi lần chuyển tab, xem ghi chú ở pageInit bên dưới) nên không cần tự
  // đóng kết nối SSE này - EventSource sống suốt phiên làm việc, giống 2
  // interval cũ trước đây.
  let musicStatusSSE = null;

  function moKetNoiMusicStatusSSE() {
    if (musicStatusSSE) musicStatusSSE.close();
    musicStatusSSE = new EventSource('/api/music/status/stream');
    musicStatusSSE.onmessage = (e) => {
      let data;
      try {
        data = locTrangThaiPi(JSON.parse(e.data));
      } catch (err) {
        return;
      }
      // Chia sẻ trạng thái loa Pi cho mini player (mini-player.js) - khỏi mở
      // thêm 1 SSE trùng (WebKit iPhone giới hạn ~6 kết nối/host). Báo SAU khi
      // áp trạng thái giữ chỗ "Đang chuyển sang ..." (apDungTrangThaiNhac) - báo
      // trước thì mini player nhận "dừng" thô của Pi lúc đổi thiết bị, ẩn đi và
      // ĐÓNG luôn trình phát toàn màn hình rồi mới hiện lại (phản ánh thật).
      const baoMini = () => window.dispatchEvent(new CustomEvent('nhac-pi', { detail: data }));
      nhoTrangThaiPi(data);
      nhanCheDoLapTuPi(data.lap);
      if (dangPhatTrenMay()) {
        baoMini();
        if (typeof data.volume === 'number') ensureMusicHeaderVolumeRange(data.volume);
        return;
      }
      apDungTrangThaiNhac(data);
      baoMini();
    };
  }

  async function seekMusic(seconds) {
    if (dangPhatTrenMay()) { tuaTrenMay(seconds); return; }
    try {
      await api('/api/music/seek', { method: 'POST', body: JSON.stringify({ seconds }) });
    } catch (e) {
      baoLoi(e, 'Lỗi tua nhạc: ');
    } finally {
      loadMusicStatus();
    }
  }

  // phat_nhac() ở backend chạy NỀN (trả lời "đang tìm..." NGAY rồi mới thật sự
  // phát sau 5-20 giây khi tìm xong - xem music.py) - khác hẳn next/back là
  // đồng bộ (HTTP chỉ trả lời khi đã phát xong thật). Vì vậy không thể tắt
  // loader ngay khi API play trả lời như next/back được - phải tự hỏi lại trạng
  // thái tới khi thấy ĐÃ THẬT SỰ phát bài mới (so tên bài đổi khác bài trước đó,
  // hoặc giây đã phát còn rất nhỏ - phòng trường hợp phát lại đúng bài đang có).
  function choToiKhiPhatXongBaiMoi(tenBaiTruocDo) {
    return new Promise((resolve) => {
      const batDau = Date.now();
      const GIOI_HAN_MS = 30000;
      clearInterval(musicPlayPollTimer);
      musicPlayPollTimer = setInterval(async () => {
        let data;
        try {
          data = await api('/api/music/status');
        } catch (e) {
          return;
        }
        const daPhatBaiMoi = data.state === 'playing' &&
          (data.title !== tenBaiTruocDo || (data.elapsed != null && data.elapsed < 2));
        const hetGio = Date.now() - batDau > GIOI_HAN_MS;
        if (daPhatBaiMoi || hetGio) {
          clearInterval(musicPlayPollTimer);
          if (hetGio && !daPhatBaiMoi) {
            $f7.toast.show({ text: 'Không tìm được bài hát phù hợp, hoặc quá lâu chưa phát được.', closeTimeout: 3000 });
          }
          resolve();
        }
      }, 1000);
    });
  }

  // ---------- Tìm nhạc qua F7 Searchbar (navbar, kiểu expandable): gõ -> từ
  // khoá gợi ý của YouTube (/api/music/suggest, có độ trễ ngắn + bỏ qua phản
  // hồi cũ đến muộn); Enter/chạm gợi ý -> tìm (/api/music/search, ~3-5s,
  // server tự LƯU kết quả làm danh sách phát); chạm 1 bài -> phát bài đó
  // (/api/music/play_item - cả danh sách thành hàng chờ Trước/Tiếp). ----------
  let musicSearchbar = null;
  let goiYTimer = null;
  let goiYLuot = 0;
  let ketQuaTim = [];
  let tuKhoaTim = '';
  let tenBaiDangPhat = '';

  function anGoiY() {
    clearTimeout(goiYTimer);
    goiYLuot++;
    document.getElementById('music-suggest').style.display = 'none';
  }

  function veGoiY(ds) {
    const wrap = document.getElementById('music-suggest');
    const ul = wrap.querySelector('ul');
    ul.innerHTML = '';
    ds.forEach((tu) => {
      const li = document.createElement('li');
      li.innerHTML =
        '<a href="#" class="item-link item-content">' +
          '<div class="item-media"><i class="icon f7-icons" style="font-size:18px;color:var(--f7-list-item-footer-text-color);">search</i></div>' +
          '<div class="item-inner"><div class="item-title"></div></div>' +
        '</a>';
      li.querySelector('.item-title').textContent = tu;
      li.querySelector('a').addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('music-query').value = tu;
        timBai();
      });
      ul.appendChild(li);
    });
    wrap.style.display = ds.length ? '' : 'none';
    if (ds.length) dinhViGoiY();
  }

  // Đặt khung gợi ý NGAY DƯỚI mép ô nhập, rộng đúng bằng ô nhập (toạ độ so
  // với .page - khung là con trực tiếp của .page, position:absolute).
  function dinhViGoiY() {
    const wrap = document.getElementById('music-suggest');
    const o = document.querySelector('#music-searchbar .searchbar-input-wrap');
    const trang = wrap && wrap.closest('.page');
    if (!o || !trang) return;
    const r = o.getBoundingClientRect();
    const t = trang.getBoundingClientRect();
    wrap.style.top = (r.bottom - t.top + 6) + 'px';
    wrap.style.left = (r.left - t.left) + 'px';
    wrap.style.width = r.width + 'px';
  }

  async function layGoiY(q) {
    const luot = ++goiYLuot;
    if (!q) { veGoiY([]); return; }
    try {
      const data = await api('/api/music/suggest?q=' + encodeURIComponent(q));
      if (luot === goiYLuot) veGoiY(data.suggestions || []);
    } catch (e) { /* gợi ý không quan trọng - lỗi thì thôi, vẫn Enter để tìm được */ }
  }

  function baoTrangThaiTim(chu, coLoader) {
    const el = document.getElementById('music-search-status');
    el.textContent = chu || '';
    if (coLoader) {
      // Preloader nhỏ của F7 trước dòng chữ - phải TỰ chèn ruột theo theme
      // (iOS 8 vạch / Material SVG), F7 chỉ tự điền cho .preloader có sẵn
      // lúc khởi động app (cùng cách htmlPreloader() bên devices.html).
      const ruot = document.documentElement.classList.contains('md')
        ? '<span class="preloader-inner"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16"></circle></svg></span>'
        : '<span class="preloader-inner">' + '<span class="preloader-inner-line"></span>'.repeat(8) + '</span>';
      el.insertAdjacentHTML('afterbegin',
        '<span class="preloader color-theme" style="--f7-preloader-size:14px;vertical-align:-2px;margin-right:6px;">' + ruot + '</span>');
    }
    el.style.display = chu ? '' : 'none';
  }

  // ---------- Danh sách: 2 tab "Kết quả tìm" | "Yêu thích" (segmented) ----------
  let dsYeuThich = [];
  let tabDangXem = 'kham_pha'; // 'kham_pha' (mặc định) | 'tim' | 'yeu_thich' | 'ds'
  let dangTim = false;

  // Danh sách phát tự tạo (/api/music/playlists): plMoId = danh sách đang
  // MỞ trong tab "Danh sách phát" (null = màn tổng quan các danh sách).
  let dsPlaylist = [];
  let plMoId = null;

  function plDangMo() {
    return dsPlaylist.find((p) => p.id === plMoId) || null;
  }

  function dsDangXem() {
    if (tabDangXem === 'kham_pha' || tabDangXem === 'dang_phat') return [];
    if (tabDangXem === 'ds') return (plDangMo() || {}).bai || [];
    if (tabDangXem === 'yeu_thich') return dsYeuThich;
    if (ketQuaLaTim && locTim !== 'tat_ca') return ketQuaTim.filter((b) => nhomBai(b) === locTim);
    return ketQuaTim;
  }

  // Tên hàng chờ khi phát (hiện ở log/hàng chờ Pi).
  function tenDanhSachDangXem() {
    if (tabDangXem === 'ds') return (plDangMo() || {}).ten || 'Danh sách phát';
    return tabDangXem === 'yeu_thich' ? 'Yêu thích' : tuKhoaTim;
  }

  function laYeuThich(id) {
    return dsYeuThich.some((b) => b.id === id);
  }

  function chonTab(tab, giuPlaylist) {
    // Playlist nằm TRONG tab Yêu thích (hàng thẻ trên cùng) - 'ds' chỉ là
    // trạng thái "đang mở 1 playlist", chip Yêu thích vẫn sáng.
    if (tab === 'ds' && (!giuPlaylist || !plDangMo())) tab = 'yeu_thich';
    if (tab !== 'ds') plMoId = null;
    tabDangXem = tab;
    const chip = tab === 'ds' ? 'yeu_thich' : tab;
    document.querySelectorAll('#music-tab .music-chip').forEach((b) => {
      b.classList.toggle('active', b.dataset.value === chip);
    });
    veKetQua();
  }

  // "10 bài · 52 phút" - kiểu dòng phụ dưới tiêu đề playlist của Tidal.
  function tomTatDanhSach(ds) {
    if (!ds.length) return '';
    const giay = ds.reduce((t, b) => t + (b.duration || 0), 0);
    const phut = Math.round(giay / 60);
    const tg = phut >= 60 ? Math.floor(phut / 60) + ' giờ ' + (phut % 60) + ' phút' : phut + ' phút';
    return ds.length + ' bài' + (giay ? ' · ' + tg : '');
  }

  // Tiêu đề lớn, dòng phụ, dòng hướng dẫn khi trống.
  function capNhatDauCard() {
    document.getElementById('music-fav-count').textContent = dsYeuThich.length;
    const pl = tabDangXem === 'ds' ? plDangMo() : null;
    document.getElementById('music-pl-quay-lai').style.display = pl ? '' : 'none';
    document.getElementById('music-pl-menu').style.display = pl ? '' : 'none';
    if (pl) {
      const coBai = (pl.bai || []).length > 0;
      document.getElementById('music-list-title').textContent = pl.ten;
      document.getElementById('music-list-phu').textContent =
        ['Playlist', tomTatDanhSach(pl.bai || []) || 'chưa có bài'].join(' · ');
      baoTrangThaiTim(coBai ? '' : 'Playlist trống - bấm ⋯ ở bài bất kỳ để thêm vào đây.');
      return;
    }
    document.getElementById('music-kp-lam-moi').style.display = tabDangXem === 'kham_pha' ? '' : 'none';
    // Tab Đang phát: tiêu đề "Đang phát" nằm TRONG cột trái (veDangPhat) để cột
    // Tiếp theo bên phải đẩy lên ngang hàng tiêu đề - ẩn tiêu đề lớn chung.
    const laDP = tabDangXem === 'dang_phat';
    document.getElementById('music-list-title').style.display = laDP ? 'none' : '';
    document.getElementById('music-list-phu').style.display = laDP ? 'none' : '';
    if (laDP) { baoTrangThaiTim(''); return; }
    if (tabDangXem === 'kham_pha') {
      document.getElementById('music-list-title').textContent = 'Khám phá';
      document.getElementById('music-list-phu').textContent = 'Gợi ý theo những bài bạn đã nghe và nhạc đang hot';
      baoTrangThaiTim('');
      return;
    }
    const xemTim = tabDangXem === 'tim';
    const ds = dsDangXem();
    // "Kênh: <tên>" (mở từ tên ca sĩ/kênh, xem moKenh) -> tiêu đề kiểu trang
    // nghệ sĩ: tên kênh (không ngoặc kép) + "Kênh YouTube · n bài".
    const laKenh = xemTim && tuKhoaTim.startsWith('Kênh: ');
    document.getElementById('music-list-title').textContent = !xemTim ? 'Yêu thích'
      : laKenh ? tuKhoaTim.slice(6) : (tuKhoaTim ? '“' + tuKhoaTim + '”' : 'Kết quả tìm');
    document.getElementById('music-list-phu').textContent =
      dangTim && xemTim ? (laKenh ? 'Đang tải bài của kênh...' : 'Đang tìm trên YouTube...')
        : [laKenh ? 'Kênh YouTube' : '', tomTatDanhSach(ds), !xemTim && dsPlaylist.length ? dsPlaylist.length + ' playlist' : '']
          .filter(Boolean).join(' · ') || (xemTim ? 'Chưa tìm bài nào' : 'Chưa có bài nào');
    if (dangTim && xemTim) return;      // đang tìm - giữ dòng "Đang tìm..."
    if (!ds.length) {
      baoTrangThaiTim(xemTim
        ? 'Bấm kính lúp trên cùng để tìm bài hát.'
        : 'Chạm trái tim ở bài bất kỳ để thêm vào đây.');
    } else {
      baoTrangThaiTim('');
    }
  }

  // Bài đang phát: tên màu chủ đề + cột sóng nhạc động phủ lên ảnh (CSS
  // .dang-phat), đứng yên khi tạm dừng (.tam-dung).
  function danhDauBaiDangPhat() {
    const moBai = baiDangMo && Date.now() < baiDangMo.han ? baiDangMo.id : null;
    document.querySelectorAll('#music-results li[data-title], #music-results .mkp-the[data-title]').forEach((li) => {
      const dangPhat = !!tenBaiDangPhat && li.dataset.title === tenBaiDangPhat;
      li.classList.toggle('dang-phat', dangPhat);
      li.classList.toggle('tam-dung', dangPhat && musicState !== 'playing');
      // Loader ngay trên ảnh bài: vừa chạm, chưa có tiếng (Pi lấy link ~2-3s).
      li.classList.toggle('dang-tai', (!!moBai && li.dataset.id === moBai) || (dangPhat && musicDangTai));
    });
    // Nút Phát/Tạm dừng cũng hiện loader (thanh desktop ở đây; mini player +
    // trình phát mở rộng nghe "nhac-dang-tai" trong mini-player.js).
    // Cả lúc ĐANG CHUYỂN thiết bị (Loa Pi <-> Mi Box...): vòng xoay ở nút play.
    const taiNut = !!moBai || (musicState === 'playing' && musicDangTai) || !!dangChuyenSangPi || Date.now() < dangChuyenBaiPi;
    document.getElementById('music-playpause-btn')?.classList.toggle('dang-tai', taiNut);
    if (taiNut !== nutDangTai) {
      nutDangTai = taiNut;
      window.dispatchEvent(new CustomEvent('nhac-dang-tai', { detail: taiNut }));
    }
  }
  let nutDangTai = false;
  let dangChuyenBaiPi = 0;       // hạn (ms) vòng xoay nút Phát lúc chờ Pi: Tiếp/Trước, Phát/Tạm dừng

  // Bài vừa chạm phát mà CHƯA phát được (Máy này: đang tải luồng; Loa Pi: Pi
  // đang lấy bài) - hiện loader trên ảnh dòng đó (CSS .dang-tai). Xong khi
  // trạng thái báo đúng bài này đang phát có tiếng (apDungTrangThaiNhac), lỗi,
  // hoặc quá 30s.
  let baiDangMo = null;
  function datBaiDangMo(bai) {
    baiDangMo = bai && bai.id ? { id: bai.id, han: Date.now() + 30000 } : null;
    danhDauBaiDangPhat();
    if (baiDangMo) setTimeout(danhDauBaiDangPhat, 30100);
  }

  function htmlPreloader() {
    if (document.documentElement.classList.contains('md')) {
      return '<span class="preloader-inner"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16"></circle></svg></span>';
    }
    return '<span class="preloader-inner">' + '<span class="preloader-inner-line"></span>'.repeat(8) + '</span>';
  }

  // Đang tìm (~3-5s): vài dòng skeleton của F7 (skeleton-text + hiệu ứng
  // sóng) đúng khuôn 1 dòng bài hát.
  // Chữ mẫu PHẢI KHÔNG DẤU: font "skeleton" của F7 chỉ có chữ Latin cơ bản,
  // ký tự có dấu (ê, ă, đ...) rơi về font thường -> lộ chữ thật (đã gặp).
  // Đủ khuôn như lúc có dữ liệu thật (tránh nhảy bố cục khi tải xong): chip lọc, ô "Kết quả hàng đầu" (chỉ khi TÌM - trang
  // kênh không có) rồi 10 dòng bài có cả chỗ tim + ⋯. Độ dài chữ mẫu đổi
  // theo dòng cho tự nhiên.
  function veSkeletonTim(ul, laTim) {
    const khoi = (cls, st) => '<span class="skeleton-block ' + (cls || '') + '"' + (st ? ' style="' + st + '"' : '') + '></span>';
    if (laTim) {
      const chip = document.createElement('li');
      chip.className = 'mkq-loc skeleton-effect-wave';
      chip.innerHTML = [76, 88, 72, 84, 92].map((w) => khoi('mkx-chip', 'width:' + w + 'px')).join('');
      ul.appendChild(chip);
      const dau = document.createElement('li');
      dau.className = 'mkq-hang-dau skeleton-text skeleton-effect-wave';
      dau.innerHTML = '<div class="mkq-nhan-muc">Ket qua hang dau</div>' +
        '<div class="mkq-tren">' + khoi('mkq-anh') + '<div class="mkq-chu"><div class="mkq-ten">Ten bai hat dang tim<br>Ten ca si chinh thuc</div>' +
        '<div class="mkq-phu music-bai-phu">Bai hat - Ten ca si - 0:00<br>000 N luot xem</div></div></div>' +
        '<div class="mkq-nut">' + khoi('mkx-vien mkx-nut-to') + khoi('mkx-vien mkx-nut-to') + '</div>';
      ul.appendChild(dau);
    }
    const ten = ['Ten bai hat dang tim kiem', 'Ten bai hat dai hon mot chut nua', 'Ten bai ngan', 'Ten bai hat - Ten ca si', 'Ten bai hat dang tim'];
    const phu = ['Ten kenh - 0:00 - 000 N luot xem', 'Ten kenh dai - 0:00', 'Kenh - 0:00 - 0,0 Tr luot xem'];
    for (let k = 0; k < 10; k++) {
      const li = document.createElement('li');
      li.className = 'music-bai-dong skeleton-text skeleton-effect-wave';
      li.innerHTML =
        '<span class="music-bai-anh">' + khoi('', 'width:100%;height:100%;') + '</span>' +
        '<span class="music-bai-chu"><span class="music-bai-ten">' + ten[k % ten.length] + '</span>' +
        '<span class="music-bai-phu">' + phu[k % phu.length] + '</span></span>' +
        khoi('mkx-icon') + khoi('mkx-icon');
      ul.appendChild(li);
    }
  }

  // Tab Yêu thích: hàng thẻ playlist cuộn NGANG trên cùng (kiểu "My
  // Collection" của Tidal) - thẻ đầu "＋ Tạo playlist", mỗi playlist 1 thẻ
  // (ảnh bài đầu, tên, số bài), chạm để mở.
  function veHangPlaylist(ul) {
    const li = document.createElement('li');
    li.className = 'music-pl-hang';
    const tao = document.createElement('a');
    tao.href = '#';
    tao.className = 'music-pl-the music-pl-tao';
    tao.innerHTML = '<span class="music-pl-bia"><i class="icon f7-icons">plus</i></span>' +
      '<span class="music-pl-ten">Tạo playlist</span><span class="music-pl-so">&nbsp;</span>';
    tao.addEventListener('click', (e) => { e.preventDefault(); rungNhe(); taoPlaylist(); });
    li.appendChild(tao);
    dsPlaylist.forEach((pl) => {
      const the = document.createElement('a');
      the.href = '#';
      the.className = 'music-pl-the';

        (dau ? '<img alt="" />' : '<i class="icon f7-icons">music_note_list</i>') + '</span>' +
