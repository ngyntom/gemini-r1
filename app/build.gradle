plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.r1.geminibot'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.r1.geminibot'
        // Phicomm R1 chạy Android 5.1 (API 22)
        minSdk 21
        targetSdk 22
        versionCode 54
        versionName '1.53'
        // R1 dùng chip RK3229 (ARMv7) – bỏ các ABI khác cho APK nhẹ
        ndk { abiFilters 'armeabi-v7a' }
    }

    // Khoá ký cố định trong repo (app/debug.keystore) để bản mới luôn cài đè được lên bản cũ.
    // Chưa có file thì dùng khoá debug mặc định (~/.android/debug.keystore).
    def repoKey = file('debug.keystore')
    if (repoKey.exists()) {
        signingConfigs {
            debug {
                storeFile repoKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    compileOptions {
        // NewPipeExtractor dùng java.time / java.nio.file: Android 5.1 không có -> desugaring
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        jniLibs { pickFirsts += ['**/libc++_shared.so'] }
        // Thư viện Java (NewPipeExtractor, Rhino…) kèm file giấy phép trùng tên
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.md'] }
    }

    // Bộ tiền xử lý âm thanh micro_speech cho microWakeWord (C++, xem src/main/cpp)
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    // 2.12+ cần Android 6 (__register_atfork, strtod_l); 2.11.0 là bản mới nhất chạy được trên R1 (API 22)
    implementation 'org.tensorflow:tensorflow-lite:2.11.0'
    // WebSocket cho Gemini Live; 3.12.x là nhánh cuối còn hỗ trợ Android 5
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // Nhạc: tìm / lấy link YouTube (như yt-dlp trên Pi) và phát (luồng m4a / webm của YouTube)
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'
}

def fetchFile = { String url, File dest ->
    if (dest.exists()) return
    dest.parentFile.mkdirs()
    ant.get(src: url, dest: dest)
}

// Mã nguồn TFLM microfrontend + kissfft (Apache-2.0) lấy từ pymicro-features, ghim theo commit.
def mfBase = 'https://raw.githubusercontent.com/rhasspy/pymicro-features/96bd69cfad79aa67697e176570d3dd87052c3def/'
def mfDir = file('src/main/cpp/third_party')
def mfLib = 'tensorflow/lite/experimental/microfrontend/lib/'
def mfFiles = (['bits.h', 'kiss_fft_common.h', 'kiss_fft_int16.cc', 'kiss_fft_int16.h', 'log_lut.cc', 'log_lut.h'] +
        ['fft', 'fft_util', 'filterbank', 'filterbank_util', 'frontend', 'frontend_util',
         'log_scale', 'log_scale_util', 'noise_reduction', 'noise_reduction_util',
         'pcan_gain_control', 'pcan_gain_control_util', 'window', 'window_util']
                .collectMany { [it + '.cc', it + '.h'] }).collect { mfLib + it } +
        ['kissfft/_kiss_fft_guts.h', 'kissfft/kiss_fft.cc', 'kissfft/kiss_fft.h',
         'kissfft/tools/kiss_fftr.cc', 'kissfft/tools/kiss_fftr.h', 'LICENSE']

tasks.register('downloadMicroFrontend') {
    doLast {
        mfFiles.each { fetchFile(mfBase + it, new File(mfDir, it)) }
    }
}

// Model microWakeWord có sẵn của ESPHome (v2).
def mwwBase = 'https://raw.githubusercontent.com/esphome/micro-wake-word-models/main/models/v2/'
def mwwDir = file('src/main/assets/mww')

tasks.register('downloadWakeModels') {
    doLast {
        ['hey_jarvis', 'okay_nabu', 'hey_mycroft', 'alexa'].each { name ->
            ['.tflite', '.json'].each { ext -> fetchFile(mwwBase + name + ext, new File(mwwDir, name + ext)) }
        }
    }
}

preBuild.dependsOn 'downloadMicroFrontend', 'downloadWakeModels'
tasks.configureEach { t ->
    if (t.name.startsWith('configureCMake') || t.name.startsWith('buildCMake')) {
        t.dependsOn 'downloadMicroFrontend'
    }
}

// Model Vosk tiếng Việt không còn nằm trong APK: loa tự tải khi chọn Vosk (xem ModelInstaller).
