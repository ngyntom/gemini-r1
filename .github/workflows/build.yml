name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # Giữ cùng một khoá ký debug giữa các lần build để APK mới cài đè được lên bản cũ
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-r1-apk
          path: app/build/outputs/apk/debug/*.apk
      # Repo chưa có app/debug.keystore: xuất khoá vừa dùng để tải lên repo một lần (khoá debug, không bí mật).
      # Chép ra thư mục thường trước: upload-artifact@v4 bỏ qua file trong thư mục ẩn (~/.android) nên trước đây không xuất được.
      - if: hashFiles('app/debug.keystore') == ''
        run: mkdir -p keystore-out && cp ~/.android/debug.keystore keystore-out/debug.keystore
      - if: hashFiles('app/debug.keystore') == ''
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: keystore-out/debug.keystore
